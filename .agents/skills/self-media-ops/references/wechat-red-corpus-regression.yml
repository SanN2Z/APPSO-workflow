schema_version: 1
rule_id: "PROJECT-WECHAT-RED-CORPUS-001"
updated_on: "2026-08-03"
purpose: "确认红库鼓励有内容任务的表达动作，同时拒绝配额化、伪造经历、热梗堆叠和例句照抄。"

decision_contract:
  encourage: "当前材料真实支持该表达动作；例句使用当前稿件自己的主体、对象、数字和结果。"
  reject_as_stencil: "表面像红项，但没有真实信息任务，或通过伪造、照抄和固定分布制造人味。"

cases:
  - id: "RED-CASE-001"
    entry_id: "WX-RED-001"
    text: "我把 20 行销售数据拖进表格，页面先补出了 18 行。"
    context: "操作录像与输出表都能核对 20 行输入和 18 行自动补全。"
    expected: "encourage"
    basis: "真实动作先于能力判断。"
    reason: "主体、动作、输入和结果都可核，后文可以继续解释缺失的 2 行。"
    communication_job: "呈现动作与不完整结果。"

  - id: "RED-CASE-002"
    entry_id: "WX-RED-002"
    text: "它交付了一个 HTML 页面、两张图和一份来源表。"
    context: "内容包实际包含这 4 项输出。"
    expected: "encourage"
    basis: "具体对象替代抽象的「完整交付」。"
    reason: "读者能据此判断交付物，并与后文逐项核对。"
    communication_job: "列明真实交付物。"

  - id: "RED-CASE-003"
    entry_id: "WX-RED-003"
    text: "下午 3 点要开选题会，我先把 6 份材料放进同一个文件夹。"
    context: "研究日志记录了会议时间、材料数和准备动作，截止点推动后续测试。"
    expected: "encourage"
    basis: "真实时间和任务建立压力。"
    reason: "场景参与因果，不是通用办公布景。"
    communication_job: "说明为什么此时需要交付。"

  - id: "RED-CASE-004"
    entry_id: "WX-RED-005"
    text: "表格生成了 20 行，其中 2 行需要人工补值。"
    context: "输出文件保存了 20 行，缺失检查命中 2 行。"
    expected: "encourage"
    basis: "结果与缺口使用同一尺度。"
    reason: "没有用对称修辞制造反差，数字可以回查。"
    communication_job: "同时交代可用范围和返工量。"

  - id: "RED-CASE-005"
    entry_id: "WX-RED-006"
    text: "这次我只测到单人账号，团队权限还不能下结论。"
    context: "作者确实只拥有单人账号，官方资料未披露团队权限。"
    expected: "encourage"
    basis: "第一人称承担样本边界。"
    reason: "限定直接约束结论范围，没有表演个人情绪。"
    communication_job: "标明证据适用范围。"

  - id: "RED-CASE-006"
    entry_id: "WX-RED-007"
    text: "6 个来源里，它漏了 1 个发布日期。"
    context: "来源表与人工复核都能确认分母 6、遗漏 1。"
    expected: "encourage"
    basis: "数字替代模糊程度词。"
    reason: "分子、分母和缺失类型完整。"
    communication_job: "量化输出缺口。"

  - id: "RED-CASE-007"
    entry_id: "WX-RED-008"
    text: "任务跑到第 11 分钟时停在权限确认页。"
    context: "录屏显示时间与停止页面。"
    expected: "encourage"
    basis: "卡点位置与时间可复核。"
    reason: "直写失败，没有用「翻车」「灾难」替代信息。"
    communication_job: "定位中断及等待成本。"

  - id: "RED-CASE-008"
    entry_id: "WX-RED-011"
    text: "最后仍要回 Excel 补退货率，再把文件发到群里。"
    context: "当前工具没有补值与发送权限，这两步由作者实际完成。"
    expected: "encourage"
    basis: "读者代价落到剩余动作。"
    reason: "比「流程未闭环」更能说明返工。"
    communication_job: "交代自动化没有覆盖的步骤。"

  - id: "RED-CASE-009"
    entry_id: "WX-RED-014"
    text: "我让它压缩会议纪要，它先起了一个比会议还长的标题。"
    context: "原纪要与生成标题长度可核，标题确实更长。"
    expected: "encourage"
    basis: "笑点来自真实错位。"
    reason: "幽默同时说明压缩任务偏离目标。"
    communication_job: "呈现错误类型并推进判断。"

  - id: "RED-CASE-010"
    entry_id: "WX-RED-018"
    text: "这次确实翻车了：退货率一列全空。"
    context: "面向熟悉工具实测的读者，冒号后立即给出 20 行全空的具体结果。"
    expected: "encourage"
    basis: "活词有具体对象和结果。"
    reason: "「翻车」只出现一次，删除会损失作者对严重程度的明确判断。"
    communication_job: "压缩一个已被证据说明的失败判断。"

  - id: "RED-CASE-011"
    entry_id: "WX-RED-006"
    text: "我第一次看到它就震惊了，整个人被稳稳接住。"
    context: "文章由二手资料编写，作者没有使用产品，也没有对应动作记录。"
    expected: "reject_as_stencil"
    basis: "伪造第一人称和罐装反应。"
    reason: "第一人称没有证据，反应不承担判断。"
    repair_target: "删除虚构体验，改写为有来源的产品事实或作者可负责的文本判断。"

  - id: "RED-CASE-012"
    entry_id: "WX-RED-018"
    text: "这个功能封神了，下一项也封神了，结尾再封神一次。"
    context: "编辑要求每节至少放一个热词。"
    expected: "reject_as_stencil"
    basis: "热词配额化。"
    reason: "没有对象、尺度与受众边界，重复后成为新模板。"
    repair_target: "删除热词，分别写出每项功能的真实结果与限制。"

  - id: "RED-CASE-013"
    entry_id: "WX-RED-015"
    text: "然后呢？"
    context: "该句单独成段，前后事实没有变化，后文也不回答问题。"
    expected: "reject_as_stencil"
    basis: "短句只制造节奏。"
    reason: "删除后没有信息损失。"
    repair_target: "删除；若确有转折，直接写中断、决定或后果。"

  - id: "RED-CASE-014"
    entry_id: "WX-RED-014"
    text: "按钮全挤在右下角，像开会时迟到的人挤在门口。"
    context: "实际截图中按钮布局正常，作者为增加人味补写笑话。"
    expected: "reject_as_stencil"
    basis: "虚构失败与比喻。"
    reason: "笑点改变事实，不能以文风为由保留。"
    repair_target: "按截图描述真实布局；没有异常就删除整句。"

  - id: "RED-CASE-015"
    entry_id: "WX-RED-001"
    text: "我把 20 行销售数据拖进表格，页面先补出了 18 行。"
    context: "当前稿实际输入 12 份 PDF，作者照抄语料库示例。"
    expected: "reject_as_stencil"
    basis: "示例照抄造成事实错误。"
    reason: "红库示例只能示范动作，不能替代当前材料。"
    repair_target: "使用当前稿真实主体、输入、动作和结果重新写。"

  - id: "RED-CASE-016"
    entry_id: "WX-RED-013"
    text: "每节必须使用 3 个口语动词，并在第二段固定出现「摊开」。"
    context: "写作 Prompt 把红项转换成数量与位置配额。"
    expected: "reject_as_stencil"
    basis: "表达动作被模板化。"
    reason: "配额让口语先于内容任务，必然制造规律性表演。"
    repair_target: "取消配额；仅在真实动作更清楚时选择普通动词。"

forbidden_implementation:
  - "authorship_or_integrity_inference"
  - "minimum_red_hit_count"
  - "copy_source_or_library_examples"
  - "fabricate_experience_or_measurement"
