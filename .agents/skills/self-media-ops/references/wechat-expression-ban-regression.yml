schema_version: 1
rule_id: "PROJECT-WECHAT-AI-LEXICON-001"
library_id: "WECHAT-EXPRESSION-LIBRARY-001"
mode: "manual_project_style_regression"
purpose: "验证公众号作者正文执行项目禁用、主理人一次明确厌恶可以形成有效 loss，并放行必须逐字准确的窄例外；任何结果都不得用于判断作者身份"
decision_order:
  - "user_feedback_and_owner_preference"
  - "repeated_internal_reader_feedback"
  - "community_and_github_candidate_expansion"
  - "academic_boundary_only"
forbidden_implementation:
  - "authorship_or_integrity_inference"
  - "ai_detector_score"
  - "automatic_literal_or_sourced_deletion_without_waiver_check"
  - "mechanical_synonym_swap"
  - "forced_slang_typos_or_punctuation_noise"

cases:
  - id: "flag-negative-parallelism"
    entry_id: "WX-EXPR-015"
    text: "这不是一次产品更新，而是一场工作方式的革命。"
    context: "正文只列出三个新增功能，没有证明旧工作方式被排除或发生制度性改变"
    basis: "explicit_project_ban_and_cross_source_aversion"
    expected: "flag"
    reason: "否定对比虚构了被推翻的 A，后半句又用宏大词替代可观察变化"
    repair_target: "删除框架，分别写明新增功能改变了谁的哪一步工作"

  - id: "flag-owner-dislikes-escalation"
    entry_id: "WX-EXPR-014"
    text: "这不仅是效率提升，更是组织能力的重新定义。"
    context: "即使两层判断都能勉强解释，主理人已明确厌恶这一递进槽位"
    basis: "single_explicit_owner_dislike_is_sufficient_loss"
    expected: "flag"
    reason: "项目审美否决无需等待跨稿统计或学术证明"
    repair_target: "写出节省的步骤和组织实际新增的能力；无法具体化则删除"

  - id: "flag-problem-level-reveal"
    entry_id: "WX-EXPR-011"
    text: "真正的问题在于，企业是否做好了准备。"
    context: "准备没有对象、尺度或责任人，下文也没有改变分析单位"
    basis: "project_ban_and_pragmatic_failure"
    expected: "flag"
    reason: "用『真正』制造洞察层级，删除后不损失具体问题"
    repair_target: "直接写明哪个部门缺什么数据、权限或流程"

  - id: "flag-report-future-ending"
    entry_id: "WX-EXPR-021"
    text: "综上所述，未来已来，让我们拭目以待。"
    context: "文章结尾没有新增边界、下一信号或读者决策"
    basis: "cross_source_recurrence_and_owner_preference"
    expected: "flag"
    reason: "报告总结与万能乐观口号叠加，任何 AI 产品稿都能使用"
    repair_target: "以当前未开放能力和下一次可验证条件收束"

  - id: "flag-chatbot-residue"
    entry_id: "WX-EXPR-022"
    text: "希望以上内容对你有所帮助。如果你愿意，我可以继续整理一份清单。"
    context: "文字出现在公众号正文末尾，不是聊天记录"
    basis: "cross_source_recurrence"
    expected: "flag"
    reason: "对话助手服务脚手架泄漏进公开文章"
    repair_target: "整段删除；若清单属于标题承诺，直接在正文交付"

  - id: "flag-canned-empathy"
    entry_id: "WX-EXPR-024"
    text: "真正好的工具，会稳稳地接住每一个努力的人。"
    context: "没有具体用户、失败动作或减负结果"
    basis: "community_aversion_and_project_preference"
    expected: "flag"
    reason: "罐装共情与金句槽位共同替代产品事实"
    repair_target: "写出工具完成的具体动作；没有事实则删除"

  - id: "flag-inference-connector"
    entry_id: "WX-EXPR-012"
    text: "这意味着，AI 正在全面改变每一家企业。"
    context: "前文只有单款产品的一次测试，没有企业范围、变化尺度或外推证据"
    basis: "single_explicit_owner_dislike_promotes_former_review_group"
    expected: "flag"
    reason: "用推断连接器把局部观察包装成大范围结论"
    repair_target: "直接写本次测试支持的对象、动作和边界"

  - id: "flag-essentialist-frame"
    entry_id: "WX-EXPR-013"
    text: "关键在于，企业要拥抱变化。"
    context: "关键对象、责任人和具体动作都没有出现，整句可搬到任何科技稿"
    basis: "single_explicit_owner_dislike_promotes_former_review_group"
    expected: "flag"
    reason: "本质化框架假装已经找到决定性变量"
    repair_target: "写明哪个团队需要补哪项数据、权限或操作"

  - id: "flag-background-connector"
    entry_id: "WX-EXPR-017"
    text: "在此背景下，企业需要积极布局。"
    context: "背景没有唯一指向，布局也没有对象、期限或验收结果"
    basis: "single_explicit_owner_dislike_promotes_former_review_group"
    expected: "flag"
    reason: "模糊连接器和空动作共同承担段落过渡"
    repair_target: "写出前述事实直接造成的约束与下一项具体动作"

  - id: "flag-explainer-frame"
    entry_id: "WX-EXPR-018"
    text: "换句话说，这是一场效率革命。"
    context: "前文已经清楚写出节省一次复制操作，后句没有增加信息"
    basis: "single_explicit_owner_dislike_promotes_former_review_group"
    expected: "flag"
    reason: "解释框架重复前句，并用宏大隐喻提高声量"
    repair_target: "删除整句；若需要释义，直接写被节省的操作"

  - id: "flag-business-abstraction"
    entry_id: "WX-EXPR-019"
    text: "用 AI 底座赋能业务闭环，推动方案落地。"
    context: "没有参与者、输入、输出、动作或验收条件"
    basis: "single_explicit_owner_dislike_promotes_former_review_group"
    expected: "flag"
    reason: "业务抽象词连续出现，读者看不到发生了什么"
    repair_target: "写明谁把哪份数据交给什么系统，最后得到什么文件或决定"

  - id: "flag-metaphorical-bill-and-submission"
    entry_id: "WX-EXPR-020"
    text: "模型交卷了，返工账单由编辑来付。"
    context: "交卷和账单都不是字面事实，只为普通返工判断制造金句感"
    basis: "single_explicit_owner_dislike_promotes_former_review_group"
    expected: "flag"
    reason: "双重隐喻把可直接说明的错误检查和修改时间包装成口号"
    repair_target: "写出模型交付后仍需核查哪些错误、编辑花多少步骤修改"

  - id: "allow-sourced-quotation"
    entry_id: "WX-EXPR-015"
    text: "受访者原话是：『这不是写作工具，而是我的资料整理入口。』"
    context: "录音已核对，说话人同意公开，正文需要准确呈现其原话"
    basis: "narrow_waiver"
    expected: "allow_with_waiver"
    waiver_type: "来源原话或受引用边界允许的短引语"
    reason: "禁用层约束作者正文，不篡改已核引语"

  - id: "allow-standard-language"
    entry_id: "WX-EXPR-015"
    text: "标准原文规定：『该字段不是字符串，而是字节数组。』"
    context: "逐字引用标准中的类型定义，改写可能改变规范含义"
    basis: "narrow_waiver"
    expected: "allow_with_waiver"
    waiver_type: "法律／标准／规范原文或必须逐字准确的术语"
    reason: "精度优先于项目句式偏好，并明确标注为规范原文"

  - id: "allow-ui-copy-under-analysis"
    entry_id: "WX-EXPR-022"
    text: "界面最后显示『如果还有问题，欢迎继续提问』。"
    context: "文章正在分析聊天机器人的收尾文案，截图与界面文字均已核对"
    basis: "narrow_waiver"
    expected: "allow_with_waiver"
    waiver_type: "官方名称、界面文字或文章正在分析的对象"
    reason: "该词式是报道对象，不是作者服务话术"

  - id: "allow-real-procedure"
    entry_id: "WX-EXPR-016"
    text: "第一步撤销旧密钥，第二步生成新密钥，第三步更新服务并验证旧密钥失效。"
    context: "安全处置存在不可交换的依赖顺序，省略序号会增加操作风险"
    basis: "narrow_waiver"
    expected: "allow_with_waiver"
    waiver_type: "真实操作步骤且序号承担实际依赖关系"
    reason: "序号表达真实程序，不是为文章制造整齐感"

  - id: "allow-literal-bill"
    entry_id: "WX-EXPR-020"
    text: "支付平台显示 7 月账单为 328 元。"
    context: "正文正在核对真实付款记录，金额与账单页面已经复核"
    basis: "narrow_waiver"
    expected: "allow_with_waiver"
    waiver_type: "字面事实或具体对象名称，词语按本义使用且改写会损失准确性"
    reason: "账单是被核对的具体付款凭证，不是返工或代价隐喻"

  - id: "allow-literal-exam-submission"
    entry_id: "WX-EXPR-020"
    text: "监考员宣布停止答题后，考生依次交卷。"
    context: "文章在报道考试现场，动作由现场记录与视频支持"
    basis: "narrow_waiver"
    expected: "allow_with_waiver"
    waiver_type: "字面事实或具体对象名称，词语按本义使用且改写会损失准确性"
    reason: "交卷是考生完成的字面动作，不是产品完成度隐喻"

  - id: "allow-official-slogan-as-object"
    entry_id: "WX-EXPR-021"
    text: "发布会主屏写着『未来已来』，但现场没有公布交付日期。"
    context: "照片与发布会视频已核对，作者随后检验口号与交付信息的差距"
    basis: "narrow_waiver"
    expected: "allow_with_waiver"
    waiver_type: "来源原话或官方口号"
    reason: "口号是被分析的事实对象，不是文章自己的收尾"

  - id: "allow-owner-can-tighten-without-waiting"
    entry_id: "WX-EXPR-023"
    text: "一切都指向同一个答案。"
    context: "当前夹具暂列禁用；若未来主理人明确允许某个特定用法，也必须记录新上下文而不能自动解除整组规则"
    basis: "project_governance_boundary"
    expected: "flag"
    reason: "项目偏好可以即时收紧；解除也应基于明确的新反馈和具体用法"
    repair_target: "直接给出答案及其证据关系"
