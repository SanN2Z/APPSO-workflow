schema_version: 1
rule_id: "PROJECT-CLUMSY-WRITING-001"
prompt_version: "0.1"
prompt_sha256: "119cffa303ce3a88a16bf7c8fbc5459c04d65f888751f04ba022d51d6f7268f3"
status: "pilot"
classification: "internal"
effectiveness_status: "unverified_hypothesis"
default_invocation: false
introduced_on: "2026-07-25"
review_after_eligible_longform_cycles: 3
next_review_on: "2026-08-25"

source:
  type: "user_confirmed_project_configuration"
  received_on: "2026-07-25"
  inspiration_prompt_ref: "APPSO-数字资产/01-栏目与品牌/品牌视觉/生图-Prompt/笨拙涂鸦重绘.md"
  note: "参考固定视觉 Prompt 的反精致化原理；不在本文件复制公司内部视觉 Prompt"

purpose: "减少 AI 稿件的过度完成感，同时保留事实、判断、逻辑、语法和可读性"

apply_after:
  - "CORE-VALUE-001 已通过"
  - "已经存在可独立审阅的实质初稿"
  - "用户明确要求测试此方法"
  - "personal 或 company 写作模式已经明确"

writing_prompt:
  zh_v0_1: |-
    把这篇稿子写得笨一点。

    保留已经确认的事实和核心判断，但不要保留原稿那些过于完整、工整、像标准答案的句子。用简单、具体的中文。句子可以忽长忽短，有些地方可以直接转过去，不必给每个段落安排漂亮的过渡和总结。

    别把每个判断都写成金句，别凑整齐的三段式，别替读者反复解释文章正在做什么。能用一个具体的人、一件事、一个动作说清，就不要换成抽象概念。

    允许一点迟疑、停顿、突兀和没那么漂亮的说法。个人稿可以保留真实的第一人称反应；公司稿不添加虚假的个人经历，只保留朴素、不油滑的表达。

    不要加入错别字、事实错误、逻辑断裂、虚构案例和刻意网络用语。稿子可以显得不太精致，但必须让人看得懂。

    算了，别收拾得太整齐。把真正想说的话说出来就行。

modes:
  personal_visible:
    trigger: "经确认的个人署名稿"
    allow:
      - "真实、相关且允许公开的第一人称经历"
      - "由思考过程自然形成的停顿、短句和不规则节奏"
      - "清楚但没有被修成金句的普通说法"
    reject:
      - "把每篇稿都写成个人成长故事"
      - "虚构经历、反应或读者共识"
  company_restrained:
    trigger: "公司、品牌或机构署名稿"
    allow:
      - "朴素、直接、具体的语言"
      - "由内容关系形成的长短句差和直接转场"
      - "承担真实判断、转向或后果的独立短句"
    reject:
      - "未经授权的作者第一人称经历"
      - "把个人观察改写成普遍事实"
      - "为了显得随意而损害公司稿的准确度"

allowed_irregularities:
  - "由内容需要形成的长短句差"
  - "不影响理解的直接转场"
  - "承担真实转向或后果的独立短句"
  - "清楚但没有被修成金句的普通说法"
  - "个人稿中真实且相关的第一人称反应"

prohibited_degradation:
  - "错别字、病句和标点错误"
  - "事实错误、无来源数字和因果跳跃"
  - "逻辑断裂、指代不清和影响理解的歧义"
  - "虚构个人经历、引语、案例或读者共识"
  - "随机加入碎句、迟疑词、网络用语或错字"
  - "改坏专业术语、数字、日期或来源原话"
  - "为了显得笨拙而降低公司稿的准确度"

anti_stencil:
  - "不规定短句、口语或突兀转场的数量"
  - "不要求出现「算了」「说白了」「其实」等词"
  - "不把灵感 Prompt 的 whatever 复制成固定结尾"
  - "没有自然形成的笨拙感时，不主动注入"
  - "不同稿件由核心判断、材料关系和写作模式决定节奏"

pass_condition:
  - "事实、来源、逻辑、中文排版和逐句语法检查继续通过"
  - "没有只为宣布结构而存在的转场、总结或三段式"
  - "不规则节奏来自内容任务，不是按数量注入"
  - "个人或公司模式执行正确"

failure_signal:
  - "把笨拙误解成错误、含混、虚构或刻意低质"
  - "每一节重复同一种短句、口语或突兀转场"
  - "终校把全文重新磨成同一种句长和语气"
