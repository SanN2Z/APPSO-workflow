schema_version: 1
rule_id: "PROJECT-CLUMSY-WRITING-001"
prompt_version: "0.1"
evaluation: "manual_semantic_review"
notes:
  - "这些案例检查信息任务和写作模式，不做关键词、词频或句长评分"
  - "脚本不得根据案例自动重写正文"

cases:
  - id: "CLUMSY-ALLOW-001"
    mode: "company_restrained"
    example: "职业没消失。职业阶梯的第一层却可能先被抽掉。"
    expected: "allow"
    reason: "短句承担真实转向，并非随机切碎"
  - id: "CLUMSY-ALLOW-002"
    mode: "company_restrained"
    example: "模型可以生成补丁，但合并前仍需核对权限、测试和责任人。"
    expected: "allow"
    reason: "正式而精确的技术说明不需要为了笨拙而改坏"
  - id: "CLUMSY-ALLOW-003"
    mode: "personal_visible"
    example: "我第一次把编辑反馈写进 SOP 时，下一篇稿子还是漏了一项。"
    expected: "allow"
    reason: "个人稿中的真实经历承担证据和自我修正任务"
  - id: "CLUMSY-REJECT-001"
    mode: "company_restrained"
    example: "我最近发现，所有公司都已经不再招聘新人。"
    expected: "reject"
    reason: "公司稿偷渡第一人称，并把个人观察夸成普遍事实"
  - id: "CLUMSY-REJECT-002"
    mode: "personal_visible"
    example: "呃。怎么说呢。反正。AI，大概，可能，就是。"
    expected: "reject"
    reason: "随机碎句和假迟疑没有信息任务"
  - id: "CLUMSY-REJECT-003"
    mode: "company_restrained"
    example: "每一节都用「算了」或「说白了」开头。"
    expected: "reject"
    reason: "固定口语变成新的模板"
  - id: "CLUMSY-REJECT-004"
    mode: "personal_visible"
    example: "为了让故事更好看，补一个没有发生过的朋友失业案例。"
    expected: "reject"
    reason: "笨拙写作不允许虚构经历和证据"
  - id: "CLUMSY-REJECT-005"
    mode: "company_restrained"
    example: "终校把所有独立短句接成长句，并给每段补上相同总结。"
    expected: "reject"
    reason: "机械磨平会恢复匀速和过度完成感"
