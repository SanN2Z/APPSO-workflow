schema_version: 1
library_id: "WECHAT-EXPRESSION-LIBRARY-001"
updated_on: "2026-07-25"
classification: "internal"
scope: "中文科技媒体公众号解释稿、观点稿与产品稿"
mode: "semantic_candidate_library"
priority_scope: "P0 → P1 是 APPSO adapter 的项目配置；其他项目必须显式采用，不能从共享库自动继承"

policy:
  purpose: "提供优先审校候选，不用词频或关键词命中代替语义判断"
  review_order:
    - "APPSO adapter：先处理 P0 / default_avoid"
    - "APPSO adapter：再处理 P1 / semantic_review"
    - "其他项目：只把相关条目作为候选，除非自己的 adapter 显式采用上述顺序"
  required_tests:
    - "字面／来源：是不是字面事实、必要术语或有出处的原话"
    - "信息任务：删掉后会损失哪条事实、判断、条件、因果或读者后果"
    - "可迁移性：整句能否不改字搬到另一篇科技稿"
    - "邻近重复：相邻段落是否反复用同类框架宣布转折或结论"
  pass_condition: "每个实际修改都有可复述的信息理由；字面事实、来源原话、真实步骤和必要逻辑区分得到放行"
  forbidden_implementation:
    - "正文关键词黑名单"
    - "按出现次数自动判退"
    - "把一种套话机械替换成另一种套话"
    - "为了降低 AI 检测分数而随机加入口语、短句或错别字"

action_levels:
  default_avoid: "默认删除元话语，或直接写出其遮住的事实与关系；有明确来源或必要信息任务时可保留"
  semantic_review: "只列为候选；完成字面／来源、删除、可迁移和邻近重复检查后再决定"

entries:
  - id: "WX-EXPR-001"
    priority: "P0"
    action: "default_avoid"
    label: "注意力提示语"
    patterns:
      - "值得注意的是"
      - "需要指出的是"
      - "需要强调的是"
      - "真正值得关注的是"
    mechanism: "先宣布某句重要，再让读者等待内容；重要性没有由证据本身建立"
    repair: "删掉提示语，直接写事实、比较或后果"
    allow: "来源原话，或确需区分主要结果与次要结果且下文立即给出尺度"

  - id: "WX-EXPR-002"
    priority: "P0"
    action: "default_avoid"
    label: "空泛权威"
    patterns:
      - "研究表明"
      - "业内普遍认为"
      - "观察人士指出"
      - "大量实践证明"
    mechanism: "用不可核对的群体或研究替代来源"
    repair: "写明研究、机构、样本、日期和它实际支持的结论；无法补足则删除"
    allow: "同句或相邻句已给出可核对来源与适用范围"

  - id: "WX-EXPR-003"
    priority: "P0"
    action: "default_avoid"
    label: "预制确定性"
    patterns:
      - "答案很明确"
      - "结论很清晰"
      - "原因很简单"
      - "问题很直接"
    mechanism: "在证据之前替读者宣布确定性，常掩盖条件和未知项"
    repair: "直接给答案、原因与成立条件"
    allow: "完成严格推导后的短收束，且没有省略反例或不确定性"

  - id: "WX-EXPR-004"
    priority: "P0"
    action: "default_avoid"
    label: "报告式总结"
    patterns:
      - "综上所述"
      - "总而言之"
      - "总的来说"
      - "总体来看"
    mechanism: "复述已经出现的材料，模拟报告收尾"
    repair: "删掉重复总结；结尾回到标题问题并增加由正文证据推出的一层后果"
    allow: "法规、会议纪要或正式报告体确实需要显式总结"

  - id: "WX-EXPR-005"
    priority: "P0"
    action: "default_avoid"
    label: "代替论证的显然性"
    patterns:
      - "由此可见"
      - "不难看出"
      - "显而易见"
      - "可以看出"
    mechanism: "把推导过程压成读者应当自行接受的判断"
    repair: "写出证据与结论之间缺失的因果、比较或限制"
    allow: "图表读数确实直接、口径已经说明，且句子点明读到的具体变化"

  - id: "WX-EXPR-006"
    priority: "P0"
    action: "default_avoid"
    label: "万能时代背景"
    patterns:
      - "在当今这个时代"
      - "随着……快速发展"
      - "近年来……日益"
    mechanism: "用任何题目都能套用的背景延迟新闻事实或读者问题"
    repair: "从具体事件、可见变化、冲突或读者问题进入"
    allow: "趋势本身是论题，且同句给出明确时间窗和可核数据"

  - id: "WX-EXPR-007"
    priority: "P0"
    action: "default_avoid"
    label: "作者舞台指令"
    patterns:
      - "让我们深入探讨"
      - "接下来看看"
      - "下面来看"
      - "我们不妨从……说起"
    mechanism: "告诉读者文章要推进，却没有真正推进"
    repair: "直接进入下一条事实、场景或问题"
    allow: "教程中的必要操作导航，但仍应优先使用准确步骤标题"

  - id: "WX-EXPR-008"
    priority: "P0"
    action: "default_avoid"
    label: "无条件绝对化"
    patterns:
      - "不可否认"
      - "毋庸置疑"
      - "毫无疑问"
      - "众所周知"
    mechanism: "用共同常识或绝对口气绕过证据、范围与争议"
    repair: "写清谁观察到什么、证据是什么、在哪些条件下成立"
    allow: "来源原话；数学定义或已给出前提后的严格结论"

  - id: "WX-EXPR-009"
    priority: "P0"
    action: "default_avoid"
    label: "空对称框架"
    patterns:
      - "一方面……另一方面……"
      - "挑战与机遇并存"
      - "双刃剑"
    mechanism: "为了显得全面而制造两边对称，没有共同变量或真实取舍"
    repair: "分别写出收益、成本、承担者、发生条件和比较尺度"
    allow: "两侧确为同一决策的独立变量，并有证据支持"

  - id: "WX-EXPR-010"
    priority: "P0"
    action: "default_avoid"
    label: "夸张意义判断"
    patterns:
      - "重塑"
      - "重新定义"
      - "开启新篇章"
      - "深远影响"
      - "至关重要"
      - "不可或缺"
    mechanism: "用宏大程度词替代已经发生的可观察变化"
    repair: "写清改变了谁的哪个动作、指标、成本或选择，以及证据边界"
    allow: "长期数据、制度变化或明确反事实足以支持相应强度"

  - id: "WX-EXPR-011"
    priority: "P1"
    action: "semantic_review"
    label: "问题层级升级"
    patterns:
      - "更深层的问题在于"
      - "更重要的问题在于"
      - "真正的问题在于"
    mechanism: "可能提示真实层级变化，也可能只用『更深／更重要／真正』制造洞察感"
    repair: "若前后问题没有尺度变化，直接写后一句；若确有升级，写明从哪个对象或尺度转到哪个对象或尺度"
    allow: "前文问题已回答，后文明确改变分析单位、时间尺度或责任主体"

  - id: "WX-EXPR-012"
    priority: "P1"
    action: "semantic_review"
    label: "推断连接器"
    patterns:
      - "这意味着"
      - "这说明"
      - "这体现了"
      - "这表明"
    mechanism: "可以承担必要推断，也常把相关性、作者判断或重复释义伪装成结论"
    repair: "明确『什么证据，在什么条件下，支持什么范围的判断』"
    allow: "指代唯一、推断链完整、结论强度不超过证据"

  - id: "WX-EXPR-013"
    priority: "P1"
    action: "semantic_review"
    label: "本质化框架"
    patterns:
      - "关键在于"
      - "核心在于"
      - "本质上是"
      - "归根结底"
    mechanism: "可能压缩判断，也可能把多变量问题说成单一原因"
    repair: "列出决定结果的具体变量；不能证明唯一性时改为较窄判断"
    allow: "文章已比较替代解释，且后文给出决定性变量或机制"

  - id: "WX-EXPR-014"
    priority: "P1"
    action: "semantic_review"
    label: "递进升级句"
    patterns:
      - "这不仅是 A，更是 B"
      - "不仅……而且……"
      - "不仅仅是……"
    mechanism: "真实递进与自动升华共用同一外形"
    repair: "确认 A 与 B 的范围不同且后文都被证明；否则只保留信息量更高的一项"
    allow: "两层结论均有证据，并且 B 确实包含或推进 A"

  - id: "WX-EXPR-015"
    priority: "P1"
    action: "semantic_review"
    label: "高显著否定对比"
    patterns:
      - "不是 A，而是 B"
      - "与其 A，不如 B"
    mechanism: "可用于术语消歧，也容易把连续变量硬切成二选一"
    repair: "检查 A 是否真的被排除；若两者能同时成立，改写为范围、条件或权重变化"
    allow: "事实排除、术语消歧、必要分类或全文唯一的核心区分"

  - id: "WX-EXPR-016"
    priority: "P1"
    action: "semantic_review"
    label: "序号脚手架"
    patterns:
      - "首先、其次、再次、最后"
      - "第一、第二、第三"
    mechanism: "真实步骤与报告式拆分外形相同"
    repair: "只有顺序、依赖或并列尺度真实存在时使用；否则按读者下一问组织"
    allow: "操作步骤、法规条件、明确分类和同尺度比较"

  - id: "WX-EXPR-017"
    priority: "P1"
    action: "semantic_review"
    label: "背景连接器"
    patterns:
      - "在此背景下"
      - "基于此"
      - "在这样的背景下"
    mechanism: "可能建立依赖，也可能用模糊指代遮住上一段与下一段的关系"
    repair: "把所指事实和产生的具体约束写出来"
    allow: "指代范围唯一，且连接器后的动作确由前述条件触发"

  - id: "WX-EXPR-018"
    priority: "P1"
    action: "semantic_review"
    label: "解释框架词簇"
    patterns:
      - "换句话说"
      - "严格来说"
      - "有意思的是"
      - "奇怪的是"
      - "说白了"
    mechanism: "单次可帮助降维，扎堆时会让作者不断宣布自己正在解释"
    repair: "保留真正完成释义、限定或转折的一处；其他位置直接表达内容"
    allow: "删除后会丢失必要的通俗释义、精度修正或反常判断"

  - id: "WX-EXPR-019"
    priority: "P1"
    action: "semantic_review"
    label: "业务抽象名词"
    patterns:
      - "赋能"
      - "抓手"
      - "闭环"
      - "链路"
      - "底座"
      - "生态"
      - "范式"
      - "底层逻辑"
      - "落地"
    mechanism: "必要行业术语与空泛管理话语混在一起"
    repair: "首次出现时写成可见动作、参与者、输入、输出和验收结果"
    allow: "来源正式名称、业内必要术语，或正文已经完成具体定义"

  - id: "WX-EXPR-020"
    priority: "P1"
    action: "semantic_review"
    label: "非字面动作与隐喻链"
    patterns:
      - "接住"
      - "击穿"
      - "打穿"
      - "扛住"
      - "收口"
      - "推开"
      - "更锋利"
      - "更硬"
      - "到账"
      - "账单"
      - "交卷"
      - "革命"
    mechanism: "字面事实、必要术语和可移植装饰隐喻共用同一个词"
    repair: "执行 `WECHAT-HUMAN-002`：先核字面与来源，再做可迁移、删除、具体化和同域隐喻链检查"
    allow: "真实付款、账单、历史革命、考试、物理动作、来源原话和已定义的必要概念"

evidence:
  project_cases:
    - "claude-cowork-record-a-skill:CLAUDE-FB-001"
    - "spain-opta-world-cup-prediction:OPTA-FB-017"
    - "amazon-agi-ai-hiring-signals:FB-007—009"
  public_research:
    - url: "https://aclanthology.org/2023.ccl-1.46/"
      use: "中文机器生成文本检测研究背景；不把检测器分数用作发布门"
    - url: "https://www.cssn.cn/skgz/bwyc/202607/t20260703_6057355.shtml"
      use: "观察生成式文本的同质化、套式结构与语言主体性讨论"
    - url: "https://sspai.com/post/107192"
      use: "多模型中文写作实验的公开观察"
    - url: "https://baoyu.io/blog/2026-02-14/remove-ai-writing-flavor"
      use: "公开编辑经验的候选表达与修复方向；不视为权威禁词表"
    - url: "https://yage.ai/share/ai-chinese-translationese-20260418.html"
      use: "中文翻译腔与生成式表达的公开观察，用于补充候选机制"
    - url: "https://developer.cloud.tencent.com/article/2682681"
      use: "中文互联网关于 AI 写作痕迹的公开经验汇总；只作候选，不作判定器"
    - url: "https://m.thepaper.cn/newsDetail_forward_33518939"
      use: "媒体对同质化生成式表达的公开讨论"
