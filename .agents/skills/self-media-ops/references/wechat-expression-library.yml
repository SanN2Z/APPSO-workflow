schema_version: 1
library_id: "WECHAT-EXPRESSION-LIBRARY-001"
updated_on: "2026-08-03"
classification: "internal"
scope: "中文科技媒体公众号解释稿、观点稿与产品稿"
mode: "semantic_candidate_library"
companion_corpus: "wechat-red-black-corpus.yml"
priority_scope: "共享条目的 P0 / P1 不自动构成跨项目禁令；APPSO 只使用原 20 组，公众号分析稿由 PROJECT-WECHAT-AI-LEXICON-001 将全部 24 组设为项目禁用并保留窄豁免"

policy:
  purpose: "维护可解释的中文科技稿表达模式；项目可以把跨来源高共识、社区反复厌恶或主理人明确厌恶的模式设为文风禁用，但不得把命中冒充 AI 作者身份判断"
  review_order:
    - "APPSO adapter：只处理 WX-EXPR-001—020，先 P0 / default_avoid，再 P1 / semantic_review"
    - "公众号分析稿 adapter：全部 24 组进入 ban_entry_ids，不再保留常规 review_entry_ids；字面事实、来源原话和精度关键用法走窄豁免"
    - "其他项目：只把相关条目作为候选，除非自己的 adapter 显式采用"
  required_tests:
    - "字面／来源：是不是字面事实、必要术语或有出处的原话"
    - "信息任务：删掉后会损失哪条事实、判断、条件、因果或读者后果"
    - "可迁移性：整句能否不改字搬到另一篇科技稿"
    - "邻近重复：相邻段落是否反复用同类框架宣布转折或结论"
  pass_condition: "每个实际修改都有可复述的信息理由；字面事实、来源原话、真实步骤和必要逻辑区分得到放行"
  forbidden_implementation:
    - "把模式命中用作 AI 作者身份、代写或诚信判定"
    - "其他项目未采用公众号 adapter 时，未读取上下文便自动删除 semantic_review 条目"
    - "按出现次数自动判退"
    - "把一种套话机械替换成另一种套话"
    - "为了降低 AI 检测分数而随机加入口语、短句或错别字"

action_levels:
  default_avoid: "默认删除元话语，或直接写出其遮住的事实与关系；有明确来源或必要信息任务时可保留"
  semantic_review: "只列为候选；完成字面／来源、删除、可迁移和邻近重复检查后再决定"

project_adapters:
  appso:
    rule_id: "PROJECT-APPSO-EXPR-001"
    entry_ids: ["WX-EXPR-001", "WX-EXPR-002", "WX-EXPR-003", "WX-EXPR-004", "WX-EXPR-005", "WX-EXPR-006", "WX-EXPR-007", "WX-EXPR-008", "WX-EXPR-009", "WX-EXPR-010", "WX-EXPR-011", "WX-EXPR-012", "WX-EXPR-013", "WX-EXPR-014", "WX-EXPR-015", "WX-EXPR-016", "WX-EXPR-017", "WX-EXPR-018", "WX-EXPR-019", "WX-EXPR-020"]
    behavior: "保持既有 APPSO adapter：P0 默认回避，P1 语义复核；本次新增条目不自动进入公司稿规则"
  wechat_analytical:
    rule_id: "PROJECT-WECHAT-AI-LEXICON-001"
    ban_entry_ids: ["WX-EXPR-001", "WX-EXPR-002", "WX-EXPR-003", "WX-EXPR-004", "WX-EXPR-005", "WX-EXPR-006", "WX-EXPR-007", "WX-EXPR-008", "WX-EXPR-009", "WX-EXPR-010", "WX-EXPR-011", "WX-EXPR-012", "WX-EXPR-013", "WX-EXPR-014", "WX-EXPR-015", "WX-EXPR-016", "WX-EXPR-017", "WX-EXPR-018", "WX-EXPR-019", "WX-EXPR-020", "WX-EXPR-021", "WX-EXPR-022", "WX-EXPR-023", "WX-EXPR-024"]
    review_entry_ids: []
    ban_behavior: "全部 24 组在未加引号的公众号作者正文中默认删除或改为具体表达；字面事实、来源原话、精度关键用法和真实程序只能通过已记录的窄豁免保留，不得静默原样放行"
    waiver_types:
      - "来源原话或受版权边界允许的短引语"
      - "官方名称、界面文字、法律／标准／规范原文或必须逐字准确的术语"
      - "字面事实或具体对象名称，词语按本义使用且改写会损失准确性"
      - "事实排除、术语消歧或互斥分类，且改成正面陈述会损失精度"
      - "真实操作步骤、法规条件或同尺度分类，且序号表达承担实际依赖关系"
    waiver_record: "记录 entry_id、完整句、即时上下文、豁免类型、不可替代的信息任务及批准人；能改成准确正面陈述时不豁免"
    authorship_boundary: "项目文风禁用，不用于断言文本由 AI 生成，也不用于评价作者诚信"

evidence_basis:
  decision_order:
    - "用户在真实稿件中的修改意见、明确喜好与冷读反馈：公众号表达层的主损失，可以直接形成项目禁用"
    - "不同内容包反复出现的内部反馈：用于验证是否是稳定项目偏好及其读者伤害"
    - "中文社区、编辑经验与 GitHub 规则库：用于扩充候选池、发现尚未触发的相邻模式"
    - "学术研究：只用于解释组合特征、误判风险和适用边界，不凌驾于项目用户反馈"
  project_principle: "事实 gate 负责真实性与证据边界；表达 gate 在此地基上最小化用户反馈 loss。项目主理人一次明确厌恶即可形成禁用，无需第二案例、完整机制或学术共识。当前公众号 adapter 的 24 组全部默认禁用，必要字面用法只走窄豁免；该配置不外推为普遍语言规律"
  academic_boundary: "学术研究支持关注词汇、句法、篇章结构与节奏的组合差异，同时反对用静态词表或单次命中做可靠作者身份判定"
  source_note: "共享/运营/复盘/2026-08-03-中文 AI 表达模式广搜与禁用边界.md"

entries:
  - id: "WX-EXPR-001"
    priority: "P0"
    action: "default_avoid"
    label: "注意力提示语"
    patterns:
      - "值得注意的是"
      - "需要指出的是"
      - "需要强调的是"
      - "真正值得关注的是"
      - "更值得关注的是"
      - "尤其值得注意的是"
      - "最值得注意的一点是"
    mechanism: "先宣布某句重要，再让读者等待内容；重要性没有由证据本身建立"
    repair: "删掉提示语，直接写事实、比较或后果"
    allow: "来源原话，或确需区分主要结果与次要结果且下文立即给出尺度"

  - id: "WX-EXPR-002"
    priority: "P0"
    action: "default_avoid"
    label: "空泛权威"
    patterns:
      - "研究表明"
      - "业内普遍认为"
      - "观察人士指出"
      - "大量实践证明"
    mechanism: "用不可核对的群体或研究替代来源"
    repair: "写明研究、机构、样本、日期和它实际支持的结论；无法补足则删除"
    allow: "同句或相邻句已给出可核对来源与适用范围"

  - id: "WX-EXPR-003"
    priority: "P0"
    action: "default_avoid"
    label: "预制确定性"
    patterns:
      - "答案很明确"
      - "结论很清晰"
      - "原因很简单"
      - "问题很直接"
      - "事实已经很清楚"
      - "道理其实很简单"
      - "答案不言自明"
    mechanism: "在证据之前替读者宣布确定性，常掩盖条件和未知项"
    repair: "直接给答案、原因与成立条件"
    allow: "完成严格推导后的短收束，且没有省略反例或不确定性"

  - id: "WX-EXPR-004"
    priority: "P0"
    action: "default_avoid"
    label: "报告式总结"
    patterns:
      - "综上所述"
      - "总而言之"
      - "总的来说"
      - "总体来看"
    mechanism: "复述已经出现的材料，模拟报告收尾"
    repair: "删掉重复总结；结尾回到标题问题并增加由正文证据推出的一层后果"
    allow: "法规、会议纪要或正式报告体确实需要显式总结"

  - id: "WX-EXPR-005"
    priority: "P0"
    action: "default_avoid"
    label: "代替论证的显然性"
    patterns:
      - "由此可见"
      - "不难看出"
      - "显而易见"
      - "可以看出"
    mechanism: "把推导过程压成读者应当自行接受的判断"
    repair: "写出证据与结论之间缺失的因果、比较或限制"
    allow: "图表读数确实直接、口径已经说明，且句子点明读到的具体变化"

  - id: "WX-EXPR-006"
    priority: "P0"
    action: "default_avoid"
    label: "万能时代背景"
    patterns:
      - "在当今这个时代"
      - "随着……快速发展"
      - "近年来……日益"
      - "在这个 AI 加速的时代"
      - "站在……的节点上"
      - "当……浪潮席卷而来"
    mechanism: "用任何题目都能套用的背景延迟新闻事实或读者问题"
    repair: "从具体事件、可见变化、冲突或读者问题进入"
    allow: "趋势本身是论题，且同句给出明确时间窗和可核数据"

  - id: "WX-EXPR-007"
    priority: "P0"
    action: "default_avoid"
    label: "作者舞台指令"
    patterns:
      - "让我们深入探讨"
      - "接下来看看"
      - "下面来看"
      - "我们不妨从……说起"
      - "你可能会问"
      - "你有没有发现"
      - "不妨想象一下"
      - "先别急着下结论"
    mechanism: "告诉读者文章要推进，却没有真正推进"
    repair: "直接进入下一条事实、场景或问题"
    allow: "教程中的必要操作导航，但仍应优先使用准确步骤标题"

  - id: "WX-EXPR-008"
    priority: "P0"
    action: "default_avoid"
    label: "无条件绝对化"
    patterns:
      - "不可否认"
      - "毋庸置疑"
      - "毫无疑问"
      - "众所周知"
    mechanism: "用共同常识或绝对口气绕过证据、范围与争议"
    repair: "写清谁观察到什么、证据是什么、在哪些条件下成立"
    allow: "来源原话；数学定义或已给出前提后的严格结论"

  - id: "WX-EXPR-009"
    priority: "P0"
    action: "default_avoid"
    label: "空对称框架"
    patterns:
      - "一方面……另一方面……"
      - "挑战与机遇并存"
      - "双刃剑"
    mechanism: "为了显得全面而制造两边对称，没有共同变量或真实取舍"
    repair: "分别写出收益、成本、承担者、发生条件和比较尺度"
    allow: "两侧确为同一决策的独立变量，并有证据支持"

  - id: "WX-EXPR-010"
    priority: "P0"
    action: "default_avoid"
    label: "夸张意义判断"
    patterns:
      - "重塑"
      - "重新定义"
      - "开启新篇章"
      - "深远影响"
      - "至关重要"
      - "不可或缺"
      - "颠覆"
      - "里程碑"
      - "划时代"
      - "前所未有"
      - "改写格局"
      - "塑造未来"
      - "打开想象空间"
    mechanism: "用宏大程度词替代已经发生的可观察变化"
    repair: "写清改变了谁的哪个动作、指标、成本或选择，以及证据边界"
    allow: "长期数据、制度变化或明确反事实足以支持相应强度"

  - id: "WX-EXPR-011"
    priority: "P1"
    action: "semantic_review"
    label: "问题层级升级"
    patterns:
      - "更深层的问题在于"
      - "更重要的问题在于"
      - "真正的问题在于"
      - "真正值得追问的是"
      - "问题的本质是"
      - "真正的分水岭是"
    mechanism: "可能提示真实层级变化，也可能只用『更深／更重要／真正』制造洞察感"
    repair: "若前后问题没有尺度变化，直接写后一句；若确有升级，写明从哪个对象或尺度转到哪个对象或尺度"
    allow: "前文问题已回答，后文明确改变分析单位、时间尺度或责任主体"

  - id: "WX-EXPR-012"
    priority: "P1"
    action: "semantic_review"
    label: "推断连接器"
    patterns:
      - "这意味着"
      - "这说明"
      - "这体现了"
      - "这表明"
    mechanism: "可以承担必要推断，也常把相关性、作者判断或重复释义伪装成结论"
    repair: "明确『什么证据，在什么条件下，支持什么范围的判断』"
    allow: "指代唯一、推断链完整、结论强度不超过证据"

  - id: "WX-EXPR-013"
    priority: "P1"
    action: "semantic_review"
    label: "本质化框架"
    patterns:
      - "关键在于"
      - "核心在于"
      - "本质上是"
      - "归根结底"
    mechanism: "可能压缩判断，也可能把多变量问题说成单一原因"
    repair: "列出决定结果的具体变量；不能证明唯一性时改为较窄判断"
    allow: "文章已比较替代解释，且后文给出决定性变量或机制"

  - id: "WX-EXPR-014"
    priority: "P1"
    action: "semantic_review"
    label: "递进升级句"
    patterns:
      - "这不仅是 A，更是 B"
      - "不仅……而且……"
      - "不仅仅是……"
      - "不只是 A，更是 B"
      - "不仅是 A，更是 B"
      - "它带来的不只是 A"
    mechanism: "真实递进与自动升华共用同一外形"
    repair: "确认 A 与 B 的范围不同且后文都被证明；否则只保留信息量更高的一项"
    allow: "两层结论均有证据，并且 B 确实包含或推进 A"

  - id: "WX-EXPR-015"
    priority: "P1"
    action: "semantic_review"
    label: "高显著否定对比"
    patterns:
      - "不是 A，而是 B"
      - "与其 A，不如 B"
      - "并不是 A，而是 B"
      - "并非 A，而是 B"
      - "与其说 A，不如说 B"
      - "看似 A，实则 B"
      - "表面上 A，实际上 B"
      - "没有 A，只有 B"
      - "真正……的不是 A，而是 B"
    mechanism: "可用于术语消歧，也容易把连续变量硬切成二选一"
    repair: "检查 A 是否真的被排除；若两者能同时成立，改写为范围、条件或权重变化"
    allow: "事实排除、术语消歧、必要分类或全文唯一的核心区分"

  - id: "WX-EXPR-016"
    priority: "P1"
    action: "semantic_review"
    label: "序号脚手架"
    patterns:
      - "首先、其次、再次、最后"
      - "第一、第二、第三"
      - "第一点、第二点、第三点"
      - "一是、二是、三是"
    mechanism: "真实步骤与报告式拆分外形相同"
    repair: "只有顺序、依赖或并列尺度真实存在时使用；否则按读者下一问组织"
    allow: "操作步骤、法规条件、明确分类和同尺度比较"

  - id: "WX-EXPR-017"
    priority: "P1"
    action: "semantic_review"
    label: "背景连接器"
    patterns:
      - "在此背景下"
      - "基于此"
      - "在这样的背景下"
    mechanism: "可能建立依赖，也可能用模糊指代遮住上一段与下一段的关系"
    repair: "把所指事实和产生的具体约束写出来"
    allow: "指代范围唯一，且连接器后的动作确由前述条件触发"

  - id: "WX-EXPR-018"
    priority: "P1"
    action: "semantic_review"
    label: "解释框架词簇"
    patterns:
      - "换句话说"
      - "严格来说"
      - "有意思的是"
      - "奇怪的是"
      - "说白了"
    mechanism: "单次可帮助降维，扎堆时会让作者不断宣布自己正在解释"
    repair: "保留真正完成释义、限定或转折的一处；其他位置直接表达内容"
    allow: "删除后会丢失必要的通俗释义、精度修正或反常判断"

  - id: "WX-EXPR-019"
    priority: "P1"
    action: "semantic_review"
    label: "业务抽象名词"
    patterns:
      - "赋能"
      - "抓手"
      - "闭环"
      - "链路"
      - "底座"
      - "生态"
      - "范式"
      - "底层逻辑"
      - "落地"
    mechanism: "必要行业术语与空泛管理话语混在一起"
    repair: "首次出现时写成可见动作、参与者、输入、输出和验收结果"
    allow: "来源正式名称、业内必要术语，或正文已经完成具体定义"

  - id: "WX-EXPR-020"
    priority: "P1"
    action: "semantic_review"
    label: "非字面动作与隐喻链"
    patterns:
      - "接住"
      - "击穿"
      - "打穿"
      - "扛住"
      - "收口"
      - "推开"
      - "更锋利"
      - "更硬"
      - "到账"
      - "账单"
      - "交卷"
      - "革命"
    mechanism: "字面事实、必要术语和可移植装饰隐喻共用同一个词"
    repair: "执行 `WECHAT-HUMAN-002`：先核字面与来源，再做可迁移、删除、具体化和同域隐喻链检查"
    allow: "真实付款、账单、历史革命、考试、物理动作、来源原话和已定义的必要概念"

  - id: "WX-EXPR-021"
    priority: "P1"
    action: "semantic_review"
    label: "万能未来收束"
    patterns:
      - "未来已来"
      - "未来可期"
      - "让我们拭目以待"
      - "让我们共同期待"
      - "时间会给出答案"
      - "这场……才刚刚开始"
      - "新的篇章才刚刚开始"
    mechanism: "用乐观口号模拟结尾，把仍未知的条件、下一次检验或读者要承担的后果抹平"
    repair: "用已知边界、下一项可观察信号、仍待验证的条件或具体行动收束"
    allow: "来源原话、官方口号或文章正在分析该口号；公众号作者正文默认不保留"

  - id: "WX-EXPR-022"
    priority: "P1"
    action: "semantic_review"
    label: "聊天机器人服务残留"
    patterns:
      - "希望以上内容对你有所帮助"
      - "如果你愿意，我可以……"
      - "如果还有问题，欢迎继续提问"
      - "感谢你提出这个问题"
      - "让我们一起来……"
      - "当然可以"
      - "以下是……"
    mechanism: "把对话助手的应答脚手架带进公开文章，暴露服务话术而不是作者判断"
    repair: "删除寒暄与后续服务承诺，直接交付事实、方法或结论"
    allow: "真实客服记录、产品界面文案、来源引语或文章正在分析聊天机器人输出"

  - id: "WX-EXPR-023"
    priority: "P1"
    action: "semantic_review"
    label: "洞察揭晓与金句槽位"
    patterns:
      - "答案藏在……里"
      - "这背后，其实是……"
      - "这就是……的力量"
      - "……是……的底色"
      - "……给出了答案"
      - "一切都指向同一个答案"
      - "真正稀缺的是……"
      - "真正拉开差距的是……"
    mechanism: "先宣布将要揭晓洞察或金句，再把可直接陈述的关系包装成可跨题移植的格言"
    repair: "删除揭晓框架，写出具体主体、动作、比较尺度、决定或后果"
    allow: "来源原话，或该比喻建立了当前文章持续使用的具体问题模型；公众号作者正文默认不保留一次性金句槽位"

  - id: "WX-EXPR-024"
    priority: "P1"
    action: "semantic_review"
    label: "罐装共情与假亲密"
    patterns:
      - "稳稳地接住"
      - "被看见、被理解"
      - "你已经做得很好了"
      - "请允许自己……"
      - "温柔而坚定"
      - "给足安全感"
      - "松弛感"
      - "治愈"
    mechanism: "用可批量复用的安慰和亲密感替代对具体处境、代价与行动的理解"
    repair: "写清谁遇到什么限制、哪项动作减轻了什么负担；没有具体信息时删除"
    allow: "来源原话、产品正式名称、心理健康专业语境或文章正在分析该表达；公众号科技作者正文默认不借它制造亲密"

