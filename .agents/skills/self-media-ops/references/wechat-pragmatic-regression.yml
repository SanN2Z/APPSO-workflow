schema_version: 1
rule_id: "PROJECT-WECHAT-PRAGMATIC-001"
mode: "manual_semantic_regression"
purpose: "验证语用必要性检查能命中语法和转场成立但没有说话必要性的文章表演句，同时放行具体事实、必要区分、来源引语和持续参与论证的修辞"
forbidden_implementation:
  - "keyword_blacklist"
  - "ai_detector_score"
  - "generic_more_human_verdict"
  - "forced_slang_typos_or_fragments"

cases:
  - id: "flag-abstract-capability-moral"
    text: "能力的差距要如实写。"
    context: "上一段笼统比较两个模型，尚未指出哪项任务、输入、失败方式或评价尺度不同"
    communication_job: "没有可复述任务；只宣布作者会诚实评价"
    specific_referent: "能力和差距都未绑定具体测试或决定"
    transfer_test: "可原封不动移到模型、芯片、机器人或应用评测稿"
    rhetoric_self_label: "用道德姿态代替差距本身"
    deletion_test: "删除后不损失事实、判断关系或读者后果"
    read_aloud_test: "像在声明写作态度，不像在解释一次具体比较"
    expected: "flag"
    repair_target: "直接写出哪项任务、谁成功或失败、比较尺度和它改变的判断"

  - id: "flag-tension-self-label"
    text: "张力恰恰在这里。"
    context: "前文已经并列产品承诺与实际失败，但本句没有指明二者、补充证据或推进后果"
    communication_job: "没有新增任务；只提示读者把前文理解成有张力"
    specific_referent: "这里不能唯一指向某个动作、冲突或决定"
    transfer_test: "可原封不动移到多数科技评论"
    rhetoric_self_label: "直接宣布张力，而不是呈现冲突"
    deletion_test: "删除后上下文逻辑和信息均不变"
    read_aloud_test: "像作者在安排金句位置"
    expected: "flag"
    repair_target: "删除；若关系尚不清楚，直接写明承诺与失败如何冲突"

  - id: "flag-fast-business-accounting"
    text: "企业的账算得很快。"
    context: "段落只泛谈企业会控制成本，没有预算、采购、调用上限、回收期或责任人的证据"
    communication_job: "没有具体决策任务；只制造商业判断的利落感"
    specific_referent: "账未指向任何可核成本或决策"
    transfer_test: "可移植到云服务、AI 助手、机器人或订阅软件文章"
    rhetoric_self_label: "用拟人化概括替代企业实际动作"
    deletion_test: "删除后不损失成本事实或决策后果"
    read_aloud_test: "像文章收束句，不像对采购行为的说明"
    expected: "flag"
    repair_target: "写清谁在何种价格或效果条件下调整预算、采购或调用上限"

  - id: "allow-classical-last-mile-model"
    text: "为山九仞，功亏一篑。"
    context: "开头用它建立最后一步未完成就不算交付的问题模型；下一句立即列出周报、纪要、图表、发群和建待办，后文继续用最后一公里区分生成内容与完成工作"
    communication_job: "压缩并建立全文持续使用的未交付问题模型"
    specific_referent: "指向内容已生成但尚未写回、发送或创建后续动作的最后一步"
    transfer_test: "脱离当前动作链后不能承担同一论证工作"
    rhetoric_self_label: "没有宣布意义；它提供后文使用的判断模型"
    deletion_test: "删除会失去开头与后文共用的问题模型，但具体动作仍须紧随其后"
    read_aloud_test: "像用一个熟悉模型解释具体交付断点"
    expected: "allow"
    repair_target: "保留；确保下一句动作映射和后文复用都存在"

  - id: "allow-specific-capability-distinction"
    text: "模型能读取 Excel，不等于它能把结果写回原表；后者才是这次交付失败的环节。"
    context: "测试记录显示模型正确读取工作簿，却没有保存回指定文件"
    communication_job: "区分输入读取与结果写回，并定位失败环节"
    specific_referent: "Excel 工作簿的读取、写回和保存结果"
    transfer_test: "对象和失败动作绑定当前测试，不能无改动迁移"
    rhetoric_self_label: "直接陈述必要区分，没有自我宣布张力"
    deletion_test: "删除会失去失败定位和能力边界"
    read_aloud_test: "像在解释为什么任务未交付"
    expected: "allow"
    repair_target: "保留并链接测试证据"

  - id: "allow-literal-procurement-decision"
    text: "采购部门把每月调用上限从 20 万次降到 8 万次。"
    context: "有 2026 年 7 月的预算审批记录，数字、主体和口径均已核对"
    communication_job: "交代企业实际采取的成本控制动作"
    specific_referent: "采购部门、月度调用上限和两项已核数字"
    transfer_test: "主体、时间与数字绑定当前事实"
    rhetoric_self_label: "没有修辞自标"
    deletion_test: "删除会损失一条决定性采购事实"
    read_aloud_test: "像在报告可核决定"
    expected: "allow"
    repair_target: "保留并注明来源、时间和统计口径"
