schema_version: 1
rule_id: "PROJECT-WECHAT-RHYTHM-001"
mode: "manual_semantic_regression"
purpose: "验证六类句法节奏指纹只在删除后不损失事实、判断、关系或后果时成立，同时放行承担真实信息任务的排比、分号和对照句"
categories:
  - "RHY-TRIAD"
  - "RHY-SEMICOLON"
  - "RHY-UPLIFT"
  - "RHY-FLIP"
  - "RHY-DISCLAIMER"
  - "RHY-IMPORTANCE"
forbidden_implementation:
  - "keyword_blacklist"
  - "ai_detector_score"
  - "sentence_length_or_punctuation_threshold"
  - "authorship_inference"

cases:
  - id: "flag-repeated-abstract-uplift"
    category: "RHY-UPLIFT"
    texts:
      - "一根针的问题，最后问的是：大量局部方向，会逼出怎样的整体结构？"
      - "它们都在寻找一座桥：局部的东西多到一定程度，会怎样强迫整体显出形状。"
    source: "微信公众号/内容/2026/08/ai-next-wang-conjecture/draft.md"
    context: "同一篇稿件用两句抽象问法重复归纳局部到整体，没有在第二次出现时增加新对象或后果"
    deletion_test: "删除第二句只损失段末文章腔，不损失此前已给出的两个数学问题及其关系"
    expected: "flag"
    repair_target: "保留一次必要归纳；另一处直接承接具体问题或删除"

  - id: "flag-three-rhetorical-questions"
    category: "RHY-TRIAD"
    text: "哪个异常值得停下来？哪条猜想即使最后错了，也会留下新工具？哪个问题值得一群人拿十年去换答案？"
    source: "微信公众号/内容/2026/08/ai-next-wang-conjecture/draft.md"
    context: "连续三个同构问句共同宣布选题困难，没有分别承担后文要回答的三个问题"
    deletion_test: "压成一个具体判断不会损失事实或边界，只会减少整齐节拍"
    expected: "flag"
    repair_target: "保留后文真正回答的一个问题，或改成明确的筛选尺度"

  - id: "flag-semicolon-triplet"
    category: "RHY-SEMICOLON"
    text: "奥数题印在试卷上；研究数学由专家挑好方向；算法搜索拿着代码骨架和自动评分器。"
    source: "微信公众号/内容/2026/08/ai-next-wang-conjecture/draft.md"
    context: "三段同构句被排成整齐对照，真正要说的是问题是否已被圈定和结果是否容易验收"
    deletion_test: "改成一条带明确尺度的陈述可保留完整关系，分号三拍本身没有额外信息"
    expected: "flag"
    repair_target: "直接写清三类任务在选题与验收条件上的差异"

  - id: "flag-symmetric-maxim"
    category: "RHY-UPLIFT"
    text: "问题含糊时，速度只会让含糊更快地铺满屏幕。"
    source: "微信公众号/内容/2026/08/ai-next-wang-conjecture/draft.md"
    context: "段末以对称格言收束，前文已说明聊天框会快速给出像答案的内容"
    deletion_test: "删除后不损失 AI 输出速度或问题定义不足的事实，只损失格言式回声"
    expected: "flag"
    repair_target: "删除，或写出本稿中哪个含糊问题导致了什么具体错误"

  - id: "flag-symmetric-flip-code-experience"
    category: "RHY-FLIP"
    text: "代码来得及，经历来不及。"
    source: "微信公众号/内容/2026/08/deepseek-harness-internal-test/draft.md"
    context: "用镜像短句重复前文已经给出的新仓库与长期项目区别"
    deletion_test: "删除后不损失报名要求、仓库创建速度或代表作需要历史证据的判断"
    expected: "flag"
    repair_target: "保留前文的 GitHub、提交、Issue 与测试事实，删除格言式复述"

  - id: "flag-symmetric-flip-polished-output"
    category: "RHY-FLIP"
    text: "也正因为成品太像样，事实核查反而不能省。"
    source: "微信公众号/内容/2026/07/qwenwork-hands-on/draft.md"
    context: "正因为／反而结构把事实核查包装成反转，上一段已经展示了生成页面的具体错漏"
    deletion_test: "直接写核查对象和错误不会损失判断，只会失去对称翻转节奏"
    expected: "flag"
    repair_target: "写明页面中哪些架构名或产品关系需要核对"

  - id: "flag-symmetric-flip-agent-chat"
    category: "RHY-FLIP"
    text: "千问办公更像一个接完整任务的人，不太像一个等你连续追问的聊天框。"
    source: "微信公众号/内容/2026/07/qwenwork-hands-on/draft.md"
    context: "像／不太像的对称比喻替代了后文才出现的微信派活与异步执行差异"
    deletion_test: "后一句的具体操作足以承担判断，删除本句只损失人格化对照"
    expected: "flag"
    repair_target: "直接写一次性派发完整任务与连续追问在交互上的区别"

  - id: "flag-standalone-disclaimer"
    category: "RHY-DISCLAIMER"
    text: "当然，这仍然是我的判断。DeepSeek 没有公开说明筛选动机；收集高质量 bug、测试兼容性，或者顺便发现合适的人才，都可能成立。"
    source: "微信公众号/内容/2026/08/deepseek-harness-internal-test/draft.md"
    context: "限定被单独组织成免责段，且放在小节收束前"
    deletion_test: "删除自我声明不损失未知边界；边界可以压进关于 DeepSeek 未公开动机的陈述"
    expected: "flag"
    repair_target: "改成『DeepSeek 未公开筛选动机，现有信息同时支持……』"

  - id: "flag-empty-importance-announcement"
    category: "RHY-IMPORTANCE"
    text: "这个感受比「模型回答得像不像专家」更实在。"
    source: "微信公众号/内容/2026/07/qwenwork-hands-on/draft.md"
    context: "前文列出 Excel、Markdown、HTML 和预览图，后文再解释收尾动作；本句只宣布更实在"
    deletion_test: "删除后具体交付物和动作都在，事实、判断关系与读者后果不变"
    expected: "flag"
    repair_target: "删除，直接从交付物进入仍被省掉的收尾动作"

  - id: "allow-semicolon-quality-control-instruction"
    category: "RHY-SEMICOLON"
    text: "只使用官方资料，每条功能附原链接；媒体消息单独标注，找不到官方确认就写「未确认」；不要自创架构名和广告语。"
    source: "微信公众号/内容/2026/07/qwenwork-hands-on/draft.md"
    context: "三项是可执行且不可互相替代的质量控制指令"
    deletion_test: "删除任一项都会失去来源限制、未确认标注或禁止虚构命名中的一项"
    expected: "allow"
    rationale: "整齐结构服务操作准确性，不是节奏装饰"

  - id: "allow-semicolon-micro-macro-contrast"
    category: "RHY-SEMICOLON"
    text: "把两只硬球碰撞的录像倒放，力学规则依然说得通；一团气体散开以后，却几乎不会自己缩回角落。"
    source: "微信公众号/内容/2026/08/ai-next-wang-conjecture/draft.md"
    context: "两个具体物理现象建立微观可逆与宏观不可逆的必要对照"
    deletion_test: "删除任一分句都会失去对照的一侧和后文问题的事实入口"
    expected: "allow"
    rationale: "分号承载同尺度事实对照"

  - id: "allow-semicolon-new-old-project-evidence"
    category: "RHY-SEMICOLON"
    text: "新仓库可以展示 AI 此刻造得有多快；旧项目更有机会展示一个人在真实限制里做过什么取舍，又拿什么证明结果可靠。"
    source: "微信公众号/内容/2026/08/deepseek-harness-internal-test/draft.md"
    context: "两分句区分两类项目能提供的不同证据"
    deletion_test: "删除任一侧都会失去报名材料选择所需的比较维度"
    expected: "allow"
    rationale: "对偶结构承担决策比较，不是抽象格言"

  - id: "allow-semicolon-task-log-connector-state"
    category: "RHY-SEMICOLON"
    text: "任务记录显示它搜索了千问办公的新功能，也读取到了 qwenwork.cn；与此同时，右侧的浏览器连接器仍显示「待配置」。"
    source: "微信公众号/内容/2026/07/qwenwork-hands-on/draft.md"
    context: "同一界面同时显示已执行动作和未配置连接器，限制对结果解释至关重要"
    deletion_test: "删除前半句失去已执行动作，删除后半句失去能力边界"
    expected: "allow"
    rationale: "分号连接同一实测中的结果与限制"
