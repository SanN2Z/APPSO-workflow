<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="780" viewBox="0 0 1080 780">
  <rect width="1080" height="780" fill="#f7f5f0"/>
  <rect x="0" y="0" width="16" height="780" fill="#c9202b"/>
  <text x="76" y="96" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="44" font-weight="800" fill="#181818">59.6%：更看好，不是包赢</text>
  <text x="76" y="142" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" fill="#595959">Opta 对西班牙—阿根廷决赛的赛前夺冠概率</text>

  <text x="76" y="238" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#9b111e">西班牙</text>
  <text x="1004" y="238" text-anchor="end" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#9b111e">59.6%</text>
  <rect x="76" y="266" width="928" height="68" rx="8" fill="#e3ded4"/>
  <rect x="76" y="266" width="553" height="68" rx="8" fill="#c9202b"/>

  <text x="76" y="410" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#356b98">阿根廷</text>
  <text x="1004" y="410" text-anchor="end" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#356b98">40.4%</text>
  <rect x="76" y="438" width="928" height="68" rx="8" fill="#e3ded4"/>
  <rect x="76" y="438" width="375" height="68" rx="8" fill="#56a6d8"/>

  <rect x="76" y="568" width="928" height="118" rx="18" fill="#ffffff" stroke="#ddd7cb" stroke-width="2"/>
  <text x="110" y="618" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#242424">把同样的对阵放进模型很多次：</text>
  <text x="110" y="659" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" fill="#242424">西班牙大约赢 6 次，阿根廷仍能赢 4 次。</text>
  <text x="76" y="738" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#6a6a6a">数据：Opta 赛前预测，经 Yahoo Sports 等媒体转述；59.46% / 40.54% 四舍五入。</text>
</svg>
