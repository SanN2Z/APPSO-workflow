  <line x1="210" y1="270" x2="210" y2="1240" stroke="#111111" stroke-width="10" stroke-linecap="round"/>

  <g font-family="Microsoft YaHei, Arial, sans-serif">
    <circle cx="210" cy="300" r="30" fill="#ffffff" stroke="#ec1700" stroke-width="10"/>
    <rect x="290" y="240" width="800" height="150" rx="28" fill="#fff5f2" stroke="#111111" stroke-width="5"/>
    <text x="335" y="300" font-size="38" font-weight="700" fill="#111111">2022｜聊天回答</text>
    <text x="335" y="352" font-size="30" fill="#ec1700">ChatGPT</text>

    <circle cx="210" cy="520" r="30" fill="#ffffff" stroke="#ec1700" stroke-width="10"/>
    <rect x="290" y="460" width="800" height="150" rx="28" fill="#fff5f2" stroke="#111111" stroke-width="5"/>
    <text x="335" y="520" font-size="38" font-weight="700" fill="#111111">2023｜文字 + 图像</text>
    <text x="335" y="572" font-size="30" fill="#ec1700">Claude / GPT-4</text>

    <circle cx="210" cy="740" r="30" fill="#ffffff" stroke="#ec1700" stroke-width="10"/>
    <rect x="290" y="680" width="800" height="150" rx="28" fill="#fff5f2" stroke="#111111" stroke-width="5"/>
    <text x="335" y="740" font-size="38" font-weight="700" fill="#111111">2024｜推理 + 操作电脑</text>
    <text x="335" y="792" font-size="30" fill="#ec1700">reasoning / computer use</text>

    <circle cx="210" cy="960" r="30" fill="#ffffff" stroke="#ec1700" stroke-width="10"/>
    <rect x="290" y="900" width="800" height="150" rx="28" fill="#fff5f2" stroke="#111111" stroke-width="5"/>
