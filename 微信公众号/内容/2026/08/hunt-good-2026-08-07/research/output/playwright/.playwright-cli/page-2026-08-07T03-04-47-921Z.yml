            - paragraph [ref=f15e358]: Every fact, machine-readable
            - heading "Not just an answer — the evidence behind it." [level=3] [ref=f15e359]
            - paragraph [ref=f15e360]: Every claim comes back with its source, a supporting quote, a confidence level, and the tool calls that produced it. Your agent can filter by confidence, drop weak claims, and cite the rest.
