          - heading "Depth you control, not depth someone else caps." [level=2] [ref=f15e416]
        - generic [ref=f15e417]:
          - generic [ref=f15e419]:
            - generic [ref=f15e420]: "01"
            - heading "A budget is the honest stop button." [level=3] [ref=f15e421]
            - paragraph [ref=f15e422]: Research has no finish line, so the budget you set becomes the stop control. Tell Webhound how much a question is worth and it spends exactly that on depth — no more, no less.
          - generic [ref=f15e424]:
            - generic [ref=f15e425]: "02"
            - heading "A subscription profits when it does less." [level=3] [ref=f15e426]
            - paragraph [ref=f15e427]: Flat-rate research tools make more money every time they stop early. Their incentive is a shallow answer that still counts as a run — fewer sources, thinner checks, faster hand-off.
          - generic [ref=f15e429]:
            - generic [ref=f15e430]: "03"
            - heading "You pay for work, not a seat." [level=3] [ref=f15e431]
            - paragraph [ref=f15e432]: You're billed by the dollar for research actually done, so the incentive is finally to keep digging, not to bail. Depth stays a dial you control.
