        - generic [ref=f15e365]:
          - paragraph [ref=f15e366]: Use cases
          - heading "Point it at the questions your agent keeps getting wrong." [level=2] [ref=f15e367]
          - paragraph [ref=f15e368]: A design call that needs the tradeoffs from dozens of real implementations. A number that only holds up once you reconcile conflicting sources. A risk that only surfaces deep in the filings. Aim Webhound at the questions a top-of-page skim gets wrong.
        - generic [ref=f15e369]:
          - generic [ref=f15e371]:
            - heading "Weigh the evidence before you commit" [level=3] [ref=f15e372]
            - paragraph [ref=f15e373]: Before an agent locks in an architecture, a vendor, or a strategy, make it weigh real production experience first — postmortems, issue threads, and tradeoffs from dozens of sources, not the first result that ranks.
            - generic [ref=f15e374]: Report
          - generic [ref=f15e377]:
            - heading "Do the lit review before you build" [level=3] [ref=f15e378]
            - paragraph [ref=f15e379]: A search API gets your coding agent one page. Webhound runs the whole survey — current techniques, benchmarks, and failure modes across dozens of sources — so it builds on the 2026 state of the art, not its training data.
