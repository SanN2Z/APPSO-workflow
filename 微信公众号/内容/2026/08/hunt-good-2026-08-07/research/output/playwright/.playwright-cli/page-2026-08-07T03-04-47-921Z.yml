        - generic [ref=f15e308]:
          - paragraph [ref=f15e309]: Search vs. research
          - heading "Search isn't research." [level=2] [ref=f15e310]
          - paragraph [ref=f15e311]: A search returns the top results for a single query. Research follows what it finds — each answer opening new paths — and keeps digging until the question is actually answered. A few searches with a summary on top never gets there.
        - generic [ref=f15e312]:
          - generic [ref=f15e314]:
            - generic [ref=f15e315]: "01"
            - heading "Web research has no natural stopping point." [level=3] [ref=f15e316]
            - paragraph [ref=f15e317]: There's no signal that tells an agent it's done — the more it reads, the more ground it covers and the stronger the case gets. The real question isn't when the work ends. It's how much the answer is worth to you.
          - generic [ref=f15e319]:
            - generic [ref=f15e320]: "02"
            - heading "Most agent failures are missing context, not missing reasoning." [level=3] [ref=f15e321]
            - paragraph [ref=f15e322]: A coding agent misses the current best practice for a stack. An ops agent misses a policy buried in a PDF. Plain search returns the top page — not the twentieth source where the real answer lives. Webhound goes deep enough to bring back the specifics the task actually needs.
      - generic [ref=f15e324]:
