            - heading "Claims + traces" [level=3] [ref=f15e353]
            - paragraph [ref=f15e354]: Every fact as JSON, carrying its evidence, source, and confidence — so your agent can consume, filter, and cite results in code.
        - generic [ref=f15e356]:
