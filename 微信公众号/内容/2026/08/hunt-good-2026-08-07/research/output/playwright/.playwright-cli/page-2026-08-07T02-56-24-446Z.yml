                  - text: 与
                  - code [ref=e315]: mod
                  - text: 寄存器及
                  - code [ref=e316]: k_nz
                  - text: 触发器，引入了偶数提前退出机制，将比较器重构为减法器的最高有效位（MSB），并将 GCD 模块中原有的“先比后减”逻辑融合为单个可复用的减法器。
                - listitem [ref=e317]:
                  - strong [ref=e318]: 模块融合与逻辑复用（907 → 765 门，第 170-252 轮交互）
                  - text: 打破模块物理边界，将模乘器直接内联（Inline）至模幂控制状态机（FSM）中，合并三个子模块并全局共享同一组减法器，消除了跨模块的冗余接口与重复逻辑。
                - listitem [ref=e319]:
                  - strong [ref=e320]: 门级精细化打磨（765 → 678 门，第 443-500 轮交互）
                  - text: 通过共享 NOR 门树、绝对值与减法拆分（Abs-sub Splitting）以及字节至比特的选择逻辑，压榨出最后的局部面积冗余。
              - paragraph [ref=e321]:
                - text: 为验证前端优化在真实物理实现中的可行性，Qwen3.8-Max 将 RTL 设计送入标准的布局布线流程中，基于 OpenROAD（Nangate45 工艺库）生成真实的芯片物理版图。在芯片物理布局呈现中，其标准单元铺设在裸片（Die）物理平面上，金属布线层逐层叠在其上（每层一种颜色，由竖直的过孔连通）。初始版设计与最终版设计在相同物理比例下差异显著：
                - strong [ref=e322]: 初始版本芯片面积为 106×106 µm²
                - text: ，总布线长度为 33,369 µm，且时序严重违例（Slack 为 -4.46 ns）；
                - strong [ref=e323]: 最终版本芯片面积收缩至 46×46 µm²
                - text: ，布线长度锐减至 4,187 µm，且成功实现 500 MHz 频率下的时序闭合（Slack 达 +0.66 ns），芯片面积整体缩减达 81%。这表明前端架构级别的深度演进，可无缝且高效地转化为具备更小面积、更高速度和高可布线性的实体芯片成品。
              - generic [ref=e324]:
                - generic [ref=e325]: Expand
                - iframe [ref=e327]:

              - paragraph [ref=e328]: 本案例全面展示了 Qwen3.8-Max 作为自主硬件智能体基础模型在长程、多约束任务中的两项核心能力：
              - list [ref=e329]:
                - listitem [ref=e330]:
                  - strong [ref=e331]: 长程连贯优化
                  - text: ：模型能够在长达数百轮的复杂交互中保持高度连贯的系统性策略，深入执行算法级的数据通路重构，而非仅停留在浅层的语法微调或局部重构。
                - listitem [ref=e332]:
                  - strong [ref=e333]: 闭环反馈驱动自适应学习
                  - text: ：在无任何参考实现作为先验的情况下，模型完全依赖“编辑-仿真-综合-版图”的反馈闭环推进优化。每一代设计均强制通过严格的
                  - code [ref=e334]: cocotb
                  - text: 功能验证，并由 OpenROAD 布局布线流程最终闭环验证，确保了设计的物理可行性。
              - heading "长程经营，持续学习" [level=3] [ref=e335]
              - paragraph [ref=e336]:
                - text: E-Commerce Bench 是一个
                - strong [ref=e337]: 365天长周期电商经营
                - text: 模拟基准，旨在评估大语言模型在持续运营场景下的商业决策能力。该基准基于淘宝天猫真实脱敏交易数据构建，深度还原了包含
                - strong [ref=e338]: 12 种店铺类型、60 个商品类目、近 600 家供应商及 7,000 种商品的复杂生态
                - text: 。模型将手握 ¥100,000 启动资金以同时运营多家网店，并在全年经营中面临季节性需求波动、突发环境事件和高仿真电商结算系统带来的现金流压力。模型必须自主进行选品、供应链议价、库存管理、动态定价及退货处理等全链路决策，并以年末实现总现金最大化为最终目标。这同时也考验模型能否在全年经营中合理配置资金，进行扩张性投资，并在周期末尾将库存等资产及时变现，避免因资产滞留而导致的最终收益折损。
              - paragraph [ref=e339]:
                - text: 在议价谈判中，基准引入了由
                - strong [ref=e340]: 博弈论内核驱动的供应商矩阵
                - text: ，每个供应商具备独立的性格特质与让步策略，要求模型通过多轮自然语言交互进行议价。Qwen3.8-Max 在议价中展现了持续学习能力：它不仅能对同一供应商的同款商品进行深度试探，实现采购价的逐轮压低与利润的稳步攀升，使代表
                - strong [ref=e341]: 议价效率的雷达图面积随时间持续增大
                - text: ；更能将这种博弈经验有效泛化到类似商品，而其他模型的议价效率在中期普遍陷入瓶颈。
              - paragraph [ref=e342]:
                - text: 此外，模型还需应对暗流涌动的复杂市场环境。基准在近 600 家供应商矩阵中，隐蔽地植入了 152 家欺诈型商家，涵盖“会费陷阱”、“低价诱导”、“货不对板”等经典欺诈模式，全面考验模型的风控能力。同时，全年大促活动的爆单压力与台风、断料等随机供应链危机交织，极限考验着模型的备货节奏与危机管理能力。在此背景下，Qwen3.8-Max 展现出了卓越的前瞻性规划能力，在经营最初期便投入最多资金布局，使其后续资产增长曲线趋势更快；并
                - strong [ref=e343]: 在年终大促期间实现超越 10 万元的净利润
                - text: ，是第二名 GLM 5.2 的近 2.4 倍。
              - paragraph [ref=e344]:
                - text: Qwen3.8-Max 最终以高达 ¥416,252（4.16×回报）的总现金胜出，超过第二名 GLM 5.2 达 38%，相较上一代旗舰模型 Qwen3.7-Max 提升 152%。这一结果表明，
                - strong [ref=e345]: Qwen3.8-Max 不仅具备长程连贯决策优势，也拥有从交易反馈中自适应学习的能力
                - text: ，在超过 2,000 轮交互中持续迭代进化，而非死守早期习得的固定策略。
              - figure [ref=e346]:
                - generic [ref=e351]:
                  - generic [ref=e353] [cursor=pointer]
                  - generic [ref=e354]:
                    - generic [ref=e355] [cursor=pointer]: 
                    - generic [ref=e357] [cursor=pointer]: 
              - heading "多模态智能体" [level=2] [ref=e360]
              - paragraph [ref=e361]:
                - text: 从它所看见的一切，到它所完成的一切，Qwen3.8-Max 展示的不只是“看懂图片、文档和视频”的能力，而是一套
                - strong [ref=e362]: 贯穿任务全流程的视觉生产力
                - text: 。
              - figure [ref=e363]:
                - generic [ref=e368]:
                  - generic [ref=e370] [cursor=pointer]
                  - generic [ref=e371]:
                    - generic [ref=e372] [cursor=pointer]: 
                    - generic [ref=e374] [cursor=pointer]: 
              - paragraph [ref=e377]:
                - text: 面对
                - strong [ref=e378]: 超过 200 页的财报和复杂 PDF
                - text: ，它可以跨页面理解文字、图表和版面结构，从大量信息中提炼关键结论，生成结构化报告与可交付的网页；面对
                - strong [ref=e379]: 超过 100 小时的长视频
                - text: ，它不仅能够定位具体片段、回答细节问题，还可以将人物、事件、时间和场景组织成
                - strong [ref=e380]: 视频 Graph 记忆
                - text: ，在长时间跨度中持续建立关联，梳理事件演进、人物关系与关键节点。无论是数百页文档、完整剧集，还是百小时直播，原本难以被一次性消化的信息，都能够被转化为
                - strong [ref=e381]: 可检索、可追溯、可交互的知识结构
                - text: 。
              - paragraph [ref=e382]: 在理解之外，Qwen3.8-Max 还能进一步完成真实的视觉生产任务：把生活素材剪辑成 Vlog，把一道题转化为沉浸式教学动画，把一张界面截图还原为完整前端项目，把户型图构建成 Blender 3D 装修效果，并从需求出发开发可交互的游戏和应用。
              - paragraph [ref=e383]:
                - text: 更重要的是，
                - strong [ref=e384]: 视觉能力并不只出现在任务的输入端
                - text: 。模型在执行过程中会持续观察自己的中间产物，检查页面布局、物体方向、空间关系、动画效果和交互结果；一旦发现电视放反、界面错位、视觉效果不符合预期等问题，就能够
                - strong [ref=e385]: 定位偏差、重新规划并自主修正
                - text: 。
              - paragraph [ref=e386]:
                - text: 这意味着，视觉不再只是 Agent 用来“理解输入”的一种模态，而是
                - strong [ref=e387]: 贯穿规划、执行、验证和迭代的原生反馈回路
                - text: 。模型一边生成，一边观察；一边行动，一边审查；通过不断地“看结果、找问题、再优化”，将任务从能够完成推进到
                - strong [ref=e388]: 真正做好
                - text: 。Qwen3.8-Max 正在让多模态 Agent 从“
                - strong [ref=e389]: 看懂世界
                - text: ”，走向“
                - strong [ref=e390]: 基于视觉在世界中持续行动和创造
                - text: ”。
              - paragraph [ref=e391]:
                - text: 在数字世界里，要独立地把一个复杂任务真正做完，往往需要同时做两件事：
                - strong [ref=e392]: 用代码实现底层逻辑，并亲手操作界面来推进任务、观察结果
                - text: 。这种 Hybrid Agent 能力——即
                - strong [ref=e393]: 编程（Coding）与 GUI 操作
                - text: 的结合——让两条路径彼此互补：
                - strong [ref=e394]: 编程高效且大规模地完成繁重工作
                - text: ，
                - strong [ref=e395]: GUI 操作则触达人类所能看见、所能操作的一切，更关键的是把真实运行系统中的实际反馈带回来
                - text: ——将上一节的视觉反馈回路从“检查自己的产物”延伸到
                - strong [ref=e396]: 在真实、运行中的应用上验证
                - text: 。
              - paragraph [ref=e397]:
                - text: 为衡量这一能力，我们构建了
                - strong [ref=e398]: RecreationBench
                - text: ——一个长程的“应用复刻”基准，覆盖桌面（Ubuntu、macOS、Windows）、移动端（Android）与 Web 五大平台。模型只能将一个真实运行的应用当作
                - strong [ref=e399]: 黑盒
                - text: 来观察——没有源代码、也无法联网——完全依靠交互与反馈去理解它，进而从零复刻出整个应用。在此设定下，Qwen3.8-Max 已经展现出
                - strong [ref=e400]: 前沿水准的 Hybrid Agent 能力
                - text: ，通过“迭代编程—交互反馈”的反复循环，一步步逼近原始应用。
              - paragraph [ref=e401]:
                - text: 为了让这套能力更容易接入现有的 Agent 系统，我们也推出了
                - strong [ref=e402]: Qwen-MM-Plugins
                - text: 。它是一个面向多模态 Agent 的 Harness 扩展库，为不同的 Agent 框架提供图像与视频处理、多模态记忆、动态分辨率、视觉工具调用，以及视频剪辑、Blender、CAD 等专业任务支持，让
                - strong [ref=e403]: 现有 Agent Harness 都能更自然地升级为多模态原生系统
                - text: 。
              - heading "用户反馈" [level=2] [ref=e404]
              - paragraph [ref=e405]:
                - text: 对 Qwen3.8-Max 最真实的判断，来自真正拿它做事的人。无论是头部智能体应用平台、领先的开源算法团队，还是来自法律、金融、制造等领域的专业公司，新兴创业团队、个人开发者与学术科研者，都在把
                - strong [ref=e406]: 复杂、关键、长链路
                - text: 的任务持续交给它。
              - paragraph [ref=e407]:
                - text: 企业用户用它搭建和驱动大规模智能体系统，白领工作者把图片、手稿、视频等繁杂材料一次性交给它处理，开发者直接让它承担高强度工程任务，科研团队则用它跑通“文献—数据—仿真”的完整研究闭环。同一个模型，在不同领域、不同工作流中被反复用到“离不开”，最终得到一致的结论：
                - strong [ref=e408]: Qwen3.8-Max 既能稳定承接长链路的自主任务，也能一次生成可直接交付的高质量结果
                - text: 。
