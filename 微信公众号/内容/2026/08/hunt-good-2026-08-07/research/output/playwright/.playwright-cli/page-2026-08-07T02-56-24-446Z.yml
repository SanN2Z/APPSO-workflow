                - paragraph [ref=e647]: 1. Fable5 的结果可能包含回退机制。2. Terminal Bench 2.1：使用 Claude Code（avg@10）评估，超时时间 5 小时，max_tokens=131,072。对于其他所有模型，我们报告各评测框架中已发布的最佳分数：Claude Opus 4.8 和 Claude Fable 5 使用 Artificial Analysis 的 Terminus 2（https://artificialanalysis.ai/evaluations/terminalbench-v2-1）；GPT-5.6 Sol 使用 Codex（https://openai.com/index/previewing-gpt-5-6-sol/）。3. SWE-bench Pro：使用 Claude Code 评测框架评估，temp=1.0，top_p=0.95，上下文窗口 256K。已修正存在问题的任务，并在修正后的基准上重新评估所有基线模型。4. DeepSWE 1.1：使用 Claude Code 和 mini-SWE-agent 评测框架评估，temp=1.0，top_p=0.95，上下文窗口 256K。我们报告两个框架中的最高分；值得注意的是，Qwen3.8-Max 在 Claude Code 上表现最佳。5. NL2Repo-Bench：使用 Claude Code 评测框架评估。为防止奖励黑客攻击，我们禁用了试图访问特定仓库的 Bash 命令，如 pip download、pip install 和 git clone。6. FrontierSWE：使用 Claude Code 评测框架评估。其他所有可用的 MEAN@5 结果均取自 FrontierSWE 官方排行榜（https://www.frontierswe.com），数据截至 2026 年 8 月 3 日。优势分数使用官方评估脚本从原始分数重新计算。"--" 表示截至该日期尚无官方 MEAN@5 结果。7. MLS-Bench-Lite：使用 Claude Code 评估，超时时间 5 小时，max_tokens=131,072。其他模型分数均取自官方排行榜。8. PaperBench：在 BasicAgent 设置下以 Code-Dev 模式评估，由 Claude Opus 4.6 评判，取 3 次运行的平均值（每次运行最长 12 小时）。9. AndroidBench：在 95 个任务的公开子集上评估，报告 avg@3 分数。10. QwenSWEBench：内部编码基准，用于评估模型的软件工程能力。使用 Claude Code 评测框架评估。报告 avg@3，超时时间 8 小时，max_tokens=32,768，temperature=1.0，上下文窗口 256K。11. QwenQoderBench：内部编码基准，用于评估 Qoder 上的用户体验。使用 Claude Code 评测框架评估。报告 avg@5，超时时间 6 小时，max_tokens=32,768，temperature=1.0，上下文窗口 256K。12. QwenReactBench：内部 React 项目构建基准，使用 Claude Code 作为评测框架，双语（英文/中文），7 个类别；自动渲染 + 多模态评判；BT/Elo 评分。13. QwenSVGBench：内部 SVG 代码生成基准；双语（英文/中文），自动渲染 + 多模态评判；BT/Elo 评分。14. CoWorkBench：内部协作基准，用于评估跨计算机科学、金融、法律、医疗及其他生产力领域的长周期任务。15. SkillsBench：在公开的 SkillsBench v1.1 基准上评估，涵盖 87 个任务，报告每个任务三次运行的平均分数。Opus 4.8 和 Fable 5 在 Claude Code 上评估；GPT-5.6 Sol 在 Codex 上评估；Qwen 系列在 OpenCode 上评估。所有结果均来自我们自己的测试。16. Automation-Bench：在 600 个任务的公开子集上评估。17. WideSearch：外部模型使用 Claude Code 评测框架，我们的模型使用 Qwen-Agent 评测框架，报告四次运行的平均 item-F1。18. $OneMillion-Bench：使用 gemini-3.1-pro-preview 评估。19. PLawBench：使用 gemini-3.1-pro-preview 评估。20. 空白单元格（--）：分数尚不可用或不适用。
