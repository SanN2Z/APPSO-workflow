              - paragraph [ref=e1563]: Qwen3.8-Max 是我们迄今最强大的模型，也是首个 Max 规模的开源权重模型。参数规模扩展至 2.4 万亿，它在编程、真实办公、长程任务与多模态智能体等方面实现全面提升——能够以极少的人工介入将复杂、开放的目标端到端完成，交付值得信赖的成果。模型权重将于下周开源，敬请期待。我们欢迎社区反馈，期待看到大家的创造。
