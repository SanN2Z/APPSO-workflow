              - paragraph [ref=e60]:
                - text: 今天，我们正式发布了
                - strong [ref=e61]: Qwen 3.8-Max
                - text: ，这是目前 Qwen 家族中最强大的模型。这也标志着 Qwen-Max 级别的模型将首次开源权重——权重将于下周开源，敬请期待。
              - paragraph [ref=e62]:
                - text: Qwen 3.8-Max 基于 Qwen 3.5 的架构基础构建，参数规模扩展至
                - strong [ref=e63]: 2.4 万亿
                - text: ，在编程、办公、科研以及长周期任务等方面实现了全面提升。它不仅能应对更具挑战性的问题，还能更可靠地端到端完成复杂任务，输出值得信赖的成果。
              - list [ref=e64]:
                - listitem [ref=e65]:
                  - strong [ref=e66]: Qwen3.8-Max
                  - text: — 现已上线
                  - link "千问AI平台" [ref=e67] [cursor=pointer]:
                    - /url: https://www.qianwenai.com/
                  - text: ：
                  - list [ref=e68]:
                    - listitem [ref=e69]: 总参数量 2.4T（激活参数 95B），开源权重将于下周发布
                    - listitem [ref=e70]: 在编码、办公、科研及长程任务上全面升级
                    - listitem [ref=e71]: 端到端可靠交付复杂任务
                - listitem [ref=e72]:
                  - text: 可通过 API 在
                  - link "千问AI平台" [ref=e73] [cursor=pointer]:
                    - /url: https://www.qianwenai.com/
                  - text: 直接调用。
              - figure [ref=e74]
              - heading "编程能力" [level=2] [ref=e76]
              - paragraph [ref=e77]:
                - text: 对顶尖模型来说，如今的编程早已不只是"应要求写个函数"，而是从一个空文件夹出发、独立地把一个跨越数天的真实项目做到交付。我们用三个这样的挑战测试了 Qwen3.8-Max——其中每一个成果都必须靠它亲自写代码、跑代码得到，
                - strong [ref=e78]: 全程没有任何人工帮助
                - text: 。贯穿这三个案例的一条主线是：Qwen3.8-Max 并非机械地执行既定方案，而是
                - strong [ref=e79]: 通过反馈闭环不断自我进化
                - text: ——构建能自我升级的 harness、在一次次实验中打磨科研方法、在一次次提交中登上竞赛榜。
              - heading "十天级自动编程：构建自进化 Harness" [level=3] [ref=e80]
              - paragraph [ref=e81]:
                - text: 本案例中，Qwen3.8-Max 被要求从零创建
                - code [ref=e82]: oh-my-cli
                - text: 项目，并在十天级长程自动编程中构建一套自进化 harness。它将用户反馈、先进社区实践与模型自测结果统一纳入工程循环，使需求能够被规范化为 issue、由 agent 自动领取并执行，并在代码、测试、预览和日志反馈中持续迭代；项目完整 trace 均公开保存在 GitHub 仓库
                - link "qwen-code-dev-bot/oh-my-cli" [ref=e83] [cursor=pointer]:
                  - /url: https://github.com/qwen-code-dev-bot/oh-my-cli
                - text: 。
              - paragraph [ref=e84]:
                - strong [ref=e85]: 自动编程 harness 构建中的关键实现细节：
              - list [ref=e86]:
                - listitem [ref=e87]:
                  - strong [ref=e88]: Loop Engineering Setup：任务状态、派发与恢复。
                  - text: Qwen3.8-Max 将 issue 状态机、任务派发器、监控器和 watchdog 组合为统一执行循环：新需求进入 GitHub Issue 后，agent 根据状态机自动领取任务并进入
                  - code [ref=e89]: ready → leased → active
                  - text: ；实现完成后触发端到端测试与 CI 检查，通过后合并 PR。
                - listitem [ref=e90]:
                  - strong [ref=e91]: Self-testing：产品自测试与维护。
                  - text: 提交更新后模型触发 Build、Unit Test、E2E 与 Desktop Lifecycle 验证；异常状态自动回退 issue / PR 修复并重新验证。
                - listitem [ref=e92]:
                  - strong [ref=e93]: Multi-source Evolution
                  - text: ：多源需求驱动产物升级。转化社区经验、用户/开发者反馈，持续演进出
                  - code [ref=e94]: /goal
                  - text: 、
                  - code [ref=e95]: /resume
                  - text: 、Dynamic Workflow、Session Replay、Desktop 等 Harness 能力。
              - paragraph [ref=e96]:
                - text: 截至
                - strong [ref=e97]: 2026 年 7 月 30 日
                - text: ，完全由 AI 自主运行约
                - strong [ref=e98]: 16 天
                - text: 后，仓库累计留下
                - strong [ref=e99]: 265 次 commits、127 个 PR 和 151 个 issues
                - text: ，展现出持续演进的自动编程能力。
              - figure [ref=e100]:
                - generic [ref=e105]:
                  - generic [ref=e107] [cursor=pointer]
                  - generic [ref=e108]:
                    - generic [ref=e109] [cursor=pointer]: 
                    - generic [ref=e111] [cursor=pointer]: 
              - paragraph [ref=e114]: 视频 1. 在十天级长程自动编程中，Qwen3.8-Max 自主构建自进化 harness，持续完成社区需求收集、issue 派发、代码生成、验证与自我修复。
              - heading "复现一篇论文，然后超越它" [level=3] [ref=e115]
              - paragraph [ref=e116]:
                - text: 我们把一篇最新的研究论文交给模型——
                - link [ref=e117] [cursor=pointer]:
                  - /url: https://arxiv.org/abs/2605.22389
                  - emphasis [ref=e118]: 《Unified Data Selection for LLM Reasoning》
                - text: ——要求它：
                - strong [ref=e119]: 用代码复现论文实验，然后想办法做得更好。
                - text: 这篇论文要解决 AI 训练中一个非常实际的问题：当数据量远超训练预算时，
                - emphasis [ref=e120]: 到底该留下哪些样本？
                - text: 论文给出的答案是：选择那些充满"
                - strong [ref=e121]: 艰难抉择点
                - text: “的样本——也就是一段解题过程中，模型真正拿不准该往哪走的时刻。
              - paragraph [ref=e122]:
                - text: 复现论文的难点在于：Qwen3.8-Max 手里除了这篇论文和一批 GPU，别无他物——没有任何起始代码，也没有现成的流水线。数据处理脚本、训练代码、评测程序，
                - strong [ref=e123]: 全都得由它自己从零设计、从零编写
                - text: ，而这正是连熟练工程师都要花上好几天的活。
              - paragraph [ref=e124]:
                - text: Qwen3.8-Max
                - strong [ref=e125]: 完全独立地连续工作了约五天
                - text: （约
                - strong [ref=e126]: 125 小时
                - text: 不间断），写下约
                - strong [ref=e127]: 7,600 行代码
                - text: 、执行超过
                - strong [ref=e128]: 1,100 步操作
                - text: 、跑了
                - strong [ref=e129]: 33 轮 GPU 训练
                - text: 。它先用约 37 小时从零搭起论文里的整套训练与评测流水线，
                - strong [ref=e130]: 完整复现了论文的六项主要结论
                - text: ——反复在自己挑选的数据上微调 Qwen3-8B 模型，并在高难数学基准上验证效果（例如，复现论文的数据选择方法在 AIME24 上比随机挑选高出
                - strong [ref=e131]: +7.7%
                - text: ）。
              - paragraph [ref=e132]:
                - text: 随后模型更进一步，把"复现"变成了"自我进化”。在接下来的约 88 小时里，它跑起了一个自我进化的科研循环——
                - emphasis [ref=e133]: 提出假设 → 写代码 → 上 GPU 跑 → 分析 → 再试
                - text: ——横跨
                - strong [ref=e134]: 四轮探索，自己提出并测试了 18 种改进想法
                - text: 。每一轮的实验结果都反哺下一轮的假设，通过分析每个方案的问题，它最终进化出一个
                - strong [ref=e135]: 超越论文原方法
                - text: 的新做法，在竞赛级数学基准 AIME24 上再提升
                - strong [ref=e136]: 2.7 分
                - text: 。
