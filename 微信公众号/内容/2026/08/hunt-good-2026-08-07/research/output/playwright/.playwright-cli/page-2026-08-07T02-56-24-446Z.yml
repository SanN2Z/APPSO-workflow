                - paragraph [ref=e1112]:
                  - text: 1. MathVision、BabyVision、CharXiv (RQ) 和 ZeroBench：分数以"无 CI / 有 CI"格式报告。MathVision 和 CharXiv (RQ) 中少量错误的标准答案标注已根据人工验证进行修正。2. MathVision：我们的模型使用固定提示词评估，例如"请逐步推理，并将最终答案放在
                  - code [ref=e1113]: "\\boxed{}"
                  - text: 中"。对于其他模型，我们报告使用和不使用
                  - code [ref=e1114]: "\\boxed{}"
                  - text: 格式要求两次运行中的较高分数。3. MMMU-Pro：Gemini3.1-Pro 和 GPT5.6-Sol 的结果取自官方模型报告或系统卡片。其他所有模型均为内部评估。4. ClawEval-MM：分数以"Pass@3 / 平均分"格式报告。Pass@3 衡量三次试验中至少通过一次的任务百分比，平均分为三次试验的平均分数。5. Vision2Web：分数为前端、网页和网站类别的平均值，使用 Claude Code 评测框架，以 gpt-5.4-2026-03-05 作为评判模型。6. HLE-VL (w/ Tools)：分数在使用工具的情况下评估，包括代码解释器（CI）和搜索。Gemini3.1-Pro 和 GPT5.6-Sol 的工具版本分数通过其官方原生工具调用 API 端到端测量。7. OSWorld 2.0：分数以"二元 / 部分"格式报告。二元分数为获得完整任务奖励的任务百分比，部分分数汇总所有任务中获得的部分奖励。8. ScreenSpot Pro：Opus4.8 和 Fable5 的分数取自官方系统卡片。Fable5 的结果指对应的 Mythos Preview 分数。其他所有模型均为内部评估。9. WebArena-Verified：分数使用 OSWorld 框架内的官方 WebArena 评分器报告。10. RecreationBench：内部长周期应用重现基准，用于评估跨五个平台（Ubuntu、macOS、Windows、Android 和 Web）的混合智能体能力。11. PerceptionBench：对比模型的分数取自该基准的官方发布报告，我们的模型为内部评估。12. VideoMME (w/ Sub.) 和 VideoMME v2 (w/ Sub.)：分数在启用字幕的情况下评估。13. QwenBlenderBench 和 QwenVisualOffice：均为内部基准。14. LVBench 和 EgoLife (w/ Mem.)：分数使用基于 Qwen-MM-Plugins 构建的记忆系统评估，支持细粒度、长周期视频记忆。15. VideoDR (w/ Search)：分数在使用搜索工具的情况下评估。16. 空白单元格（--）：分数尚不可用或不适用。
