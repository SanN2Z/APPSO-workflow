                  - paragraph [ref=e168]:
                    - strong [ref=e169]: 持续扩展真实环境，并在这些独立维度上解耦合
                    - text: ：
                    - emphasis [ref=e170]: 任务（Task）
                    - text: （单任务 → 多任务 → 跨天任务）、
                    - emphasis [ref=e171]: 工作空间（Workspace）
                    - text: （多文件 → 层级目录 → 复杂异构目录）、
                    - emphasis [ref=e172]: Harness
                    - text: （不同的类别、版本、技能）。这使得环境数能够
                    - strong [ref=e173]: 以组合方式自然增长
                    - text: ，而非依赖逐一定制化集成。
                - listitem [ref=e174]:
                  - paragraph [ref=e175]:
                    - text: 构建一个
                    - strong [ref=e176]: 统一的奖励系统
                    - text: ，将真实任务中异构的验证方式内化其中。该系统涵盖基于执行的校验、对文本及渲染后的视觉输出的 rubric 评估、以及 agentic 检查。我们将多种形式与模态统一在一个奖励系统内，为所有环境提供了一致而可靠的奖励信号，消除维护任务专用的 verifier 所固有的不一致性。
                - listitem [ref=e177]:
                  - paragraph [ref=e178]:
                    - text: 构建
                    - strong [ref=e179]: 一个在线数据均衡器
                    - text: ，对每个 batch 进行重构，使其在任务、难度、工作区与 harness 上的分布高度均衡，
                    - strong [ref=e180]: 降低 batch 间梯度方差
                    - text: ，从而支撑强化学习的训练算力稳定、持续地扩展。
