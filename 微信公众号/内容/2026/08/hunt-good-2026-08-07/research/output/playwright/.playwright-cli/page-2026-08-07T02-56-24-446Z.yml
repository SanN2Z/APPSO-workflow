                - strong [ref=e165]: 扩展真实世界的强化学习系统。
                - text: 通过联合扩展强化学习的环境数量与训练算力，我们在主流 harness（QwenWork / Claude Code / Codex / OpenClaw / Hermes）上观察到模型通用工作的能力持续提升。为了做到这一点，需要解决三个相互耦合的挑战：
              - list [ref=e166]:
