# 微信公众号草稿字段。draft.md 仍是正文唯一真源；Wenyan 负责渲染和上传。
# project_adapter 必须与内容包真实归属及生图计划一致；APPSO 包改为 appsso。
# title 留空时使用 draft.md frontmatter 标题；正式草稿标题最多 32 个字。
title: ""
author: ""
digest: ""
cover: "assets/cover.png"
source_url: ""
project_adapter: "generic"
theme: "default"
# APPSO 普通长文改为 appsso-article-v1；Hunt Good 与个人公众号不得套用。
