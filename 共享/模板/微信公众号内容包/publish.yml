# 尾图启用时按 Asia/Shanghai 填写复核截止日 YYYY-MM-DD；它不是活动真实截止日。
# 从本次确认日起最长不得超过 365 天，且必须填写与图片内容一致的 footer_alt。
footer_valid_until: ""
