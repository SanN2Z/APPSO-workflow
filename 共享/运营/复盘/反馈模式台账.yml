schema_version: 1
updated_on: "2026-07-23"

# 原始反馈留在内容包或受限反馈库；这里只保存脱敏后的跨案例模式。
patterns:
  - id: "CORE-PROMISE-001"
    pattern: "标题、开头、正文框架和结尾争夺多个承诺，导致读者无法复述中心问题"
    evidence_level: "E2"
    source_cases: ["tibo-gpt56-quota:TIBO-F-01", "spain-opta-world-cup-prediction:OPTA-FB-001—005,016", "amazon-agi-ai-hiring-signals:FB-007"]
    disposition: "promoted_provisional"
    rule_source: "共享/运营/SOP/内容工作流.md#可执行核心规则"
    trigger: "一篇内容同时出现多个标题钩子、中心问题或结尾落点"
    action: "在 brief 锁定一个可复述承诺，删除或下沉其他钩子"
    pass_condition: "冷读者能复述唯一问题，结尾新增信息并回答同一承诺"
    failure_signal: "冷读复述出现两个以上并列主旨，或结尾只重复 / 抢走开头"
    scope: "所有解释稿与观点稿；短资讯只保留一个冲突"
    owner: "managing_editor"
    classification: "internal"
    introduced_on: "2026-07-21"
    regression_check: "Amazon 就业分析稿隐藏小标题后只能复述『公司还会不会招第二个人』一个中心问题；方法稿若 brief 明确承诺清单，结尾交付清单必须放行"
    next_review_on: "2026-08-21"

  - id: "CORE-FACTCARD-001"
    pattern: "默认读者已经看过发布材料或认识陌生主体，分析失去共同事实底座"
    evidence_level: "E2"
    source_cases: ["tibo-gpt56-quota:TIBO-F-03", "spain-opta-world-cup-prediction:OPTA-FB-009"]
    disposition: "promoted_provisional"
    rule_source: "共享/运营/SOP/内容工作流.md#可执行核心规则"
    trigger: "正文判断依赖陌生产品、机构、事件或协议"
    action: "在分析前补足改变理解所需的最小共同事实，不固定为 60 秒或特定卡片形式"
    pass_condition: "圈外冷读能复述主体、发生了什么和理解判断所需的关键事实"
    failure_signal: "读者必须依赖发布会、旧稿或私有提纲才能理解后文"
    scope: "需要背景的解释稿；读者已知且不改变判断时可省略"
    owner: "evidence_editor"
    classification: "internal"
    introduced_on: "2026-07-21"
    regression_check: "下一篇陌生主体稿检查背景是否最小且足够"
    next_review_on: "2026-08-21"

  - id: "CORE-HUMAN-001"
    pattern: "AI 味来自报告式结构、机械分节和重复总结，而不只是某几个词"
    evidence_level: "E2"
    source_cases: ["tibo-gpt56-quota:TIBO-F-04—05", "spain-opta-world-cup-prediction:OPTA-FB-014—018", "openai-long-horizon-safety:LH-FB-003,005", "amazon-agi-ai-hiring-signals:FB-007—009"]
    disposition: "promoted_provisional"
    rule_source: "共享/运营/SOP/内容工作流.md#可执行核心规则"
    execution_checklist: ".agents/skills/self-media-ops/references/wechat-human-voice-pass.md"
    detection_spec: ".agents/skills/self-media-ops/references/wechat-ai-pattern-pass.md"
    trigger: "开头口语但正文报告化、段落工作重复、结尾复述目录或笑话抢走判断"
    action: "先给每段唯一工作；线性论证按读者下一问建立依赖，平行证据共享明确的问题、指标或比较尺度；再检查抽象词、自然转场、短句任务、口语落点、强修辞稀缺性、全文声音与结尾；隐藏小标题验证顺序或并列关系"
    pass_condition: "冷读者能重建问题、判断、证据、限制、读者后果和末句信息；线性材料有可复述依赖或平行材料有统一比较尺度，每个独立短句与口语都有可复述的信息任务"
    failure_signal: "只能通过替换词语改善；按来源写成几份小报告；口语均匀撒布或强对比反复承担转场；删掉结尾反而让主旨更强"
    scope: "微信公众号长文；其他平台使用对应 adapter"
    owner: "feature_writer_and_release_auditor"
    classification: "internal"
    introduced_on: "2026-07-21"
    regression_check: "Amazon 多来源长文应命中材料关系、短句任务和结尾分叉；平行证据结构可凭统一比较尺度通过；350 字事实快讯、必要产品分类与方法清单反例不得被强迫套用问题开头、口语配额或同一种叙事骨架"
    next_review_on: "2026-08-21"

  - id: "WECHAT-HUMAN-002"
    pattern: "中文公众号解释稿或方法指南用可移植的套式口语或非字面隐喻制造转折和强调，具体事实、限制与判断反而被遮住"
    evidence_level: "E2"
    source_cases: ["spain-opta-world-cup-prediction:OPTA-FB-017", "claude-cowork-record-a-skill:CLAUDE-FB-001"]
    disposition: "promoted_provisional"
    rule_source: ".agents/skills/self-media-ops/references/wechat-ai-pattern-pass.md#5-manufactured-personality"
    trigger: "中文公众号解释稿或方法指南出现可整句移植到其他 AI 新品稿的套式口语，或革命 / 战争 / 考试 / 财务等非字面隐喻链"
    action: "先识别句子承担的具体信息；删除后不损失事实或判断时直接删除，否则改写为主体、动作、条件、成本或结果"
    pass_condition: "来源原话、字面事实和必要术语可以保留；其余实例只有在删除会损失一条可明确复述的事实或判断，且无法用更具体的主体 / 动作 / 条件表达时才通过"
    failure_signal: "短语只增加口气、悬念或权威感，删掉后信息完全不变，或同一隐喻在一节内反复承担转场"
    scope: "微信公众号解释稿与方法指南；不机械禁止真实付款、计费、账单、历史革命、战争报道、教学测验和来源原话"
    owner: "feature_writer_and_release_auditor"
    classification: "internal"
    introduced_on: "2026-07-22"
    regression_check: "正例：『先别急着喊革命』『这笔账躲不掉』『入口到账』和连续交卷 / 考试隐喻必须命中；反例：『本次 API 调用账单增加 12%』作为真实计费表述必须放行"
    next_review_on: "2026-08-22"

  - id: "APPSO-VALUE-001"
    pattern: "APPSO 的 AI 产品或工作流稿只用一次演示、按钮速度、公开单价或单项跑分就宣布值得用、提效或省钱，忽略同一任务的总耗时、用量、人工收尾与结果质量"
    evidence_level: "E2"
    source_cases: ["tibo-gpt56-quota:TIBO-COST-001", "claude-cowork-record-a-skill:CLAUDE-FB-002-VALUE"]
    disposition: "promoted_provisional"
    rule_source: "APPSO-数字资产/03-SOP/APPSO 内容生产 SOP.md#ai-产品与工作流的端到端价值判断"
    trigger: "APPSO 的 AI 产品或工作流稿声称某项功能值得用、变快、变便宜、提效或可以替代人工流程"
    action: "先固定同一任务和比较基线，再选择会改变结论的端到端变量：配置或录制、运行与重试、token / 额度 / 金钱用量、人工监督 / 异常 / 验收 / 收尾、完成率 / 质量 / 新材料稳定性；关键未知项必须明示"
    pass_condition: "读者能指出比较任务、基线、已测与未知的决定性变量，以及什么结果会推翻当前判断"
    failure_signal: "用单价、单次演示、成功点击或鼠标速度直接推出总体价值，或省略仍需人工全程监督与收尾的成本"
    scope: "APPSO 的 AI 产品稿与工作流解释稿；不作效率判断的短讯不强制成本表，安全稿可优先使用权限、可逆性与事故后果"
    owner: "evidence_editor_and_feature_writer"
    classification: "internal"
    introduced_on: "2026-07-22"
    regression_check: "失败例：只列 token 单价或演示速度便宣布『更省』；通过例：同一任务基线明确，决定性变量已测或标 unknown；反例：只报道功能上线且不作价值判断时不要求完整端到端表"
    next_review_on: "2026-08-22"

  - id: "CORE-COPYEDIT-001"
    pattern: "冷读通过后，正文仍可能残留主谓、比较、格式，以及依赖聊天、brief 或版本历史才能理解的内部指代"
    evidence_level: "E2"
    source_cases: ["tibo-gpt56-quota:TIBO-COPY-001—034", "spain-opta-world-cup-prediction:OPTA-OPEN-001", "openai-long-horizon-safety:LH-FB-011"]
    disposition: "promoted_provisional"
    rule_source: ".agents/skills/self-media-ops/references/wechat-copyedit-pass.md"
    trigger: "结构、事实和人话检查稳定，准备进入发布审计"
    action: "只看标题与读者可见正文逐句终校；对原稿、上轮、上一版、本轮补充等生产阶段回指逐一寻找公开对象；缺少公开对象时改成具体主题或删除；修复后重跑全篇并锁正文哈希"
    pass_condition: "所有回指都能在公开正文内找到唯一对象，无 open COPY 缺陷，draft 与 copyedit 哈希一致，validator 通过"
    failure_signal: "一句话必须借助聊天、brief、diff、文件历史或编辑记忆才能知道原稿、上一版、本轮指什么；或正文改动后仍沿用旧终校结论"
    scope: "所有公众号正式稿"
    owner: "copy_editor"
    classification: "internal"
    introduced_on: "2026-07-21"
    regression_check: "无公开对象的这件事延续了原稿的问题必须失败；前文已明确提出权限问题和同句命名上一代产品的反例必须通过；新稿正文变更仍须让旧哈希失效"
    next_review_on: "2026-08-21"

  - id: "CORE-VISUAL-001"
    pattern: "视觉在成稿后补，导致缺图、格式混淆、图注不清和权利返工"
    evidence_level: "E2"
    source_cases: ["spain-opta-world-cup-prediction:OPTA-FB-021—030", "openai-long-horizon-safety:LH-FB-003,LH-FB-007"]
    disposition: "promoted_provisional"
    rule_source: "APPSO-数字资产/03-SOP/APPSO 内容生产 SOP.md"
    trigger: "公众号解释稿的主钩子依赖具体事件 / 界面 / 数据，或手机预览出现连续两屏高密度纯文字"
    action: "在 brief 阶段给主钩子定义证据图，并标记高密度文字区；先删重复，再用有论证任务的图片、短段或留白调整节奏"
    pass_condition: "主钩子有实际落盘并登记的视觉证据，或 visual-notes 记录无图原因与替代方案；手机预览无未处理的连续两屏高密度纯文字"
    failure_signal: "开头核心事件无图且无原因记录、只交视觉方案、用装饰图凑数、poster 冒充视频，或成稿后才发现连续大段文字"
    scope: "APPSO 与微信公众号解释稿；短资讯、无可用权利素材或图片不能增加信息时允许记录理由后不配图"
    owner: "visual_rights_editor"
    classification: "internal"
    introduced_on: "2026-07-21"
    regression_check: "下一篇非体育、非 OpenAI 的解释稿在 375 px 手机预览中检查主钩子覆盖；另测一篇不需要配图的短资讯，确认规则不会强迫插装饰图"
    next_review_on: "2026-08-21"

  - id: "CORE-STATE-001"
    pattern: "多个审校文件保留互相冲突的当前结论，没有明确失效链"
    evidence_level: "E1"
    source_cases: ["tibo-gpt56-quota:review-status-conflict"]
    disposition: "watch"
    rule_source: "AGENTS.md"
    trigger: "新的质量门推翻旧状态或旧签字"
    action: "在旧结论上标记历史 / 已失效，并让 frontmatter 成为当前状态真源"
    pass_condition: "审校、frontmatter、当前重点和发布记录不再冲突"
    failure_signal: "同一内容包同时出现 ready 与 editorial_review 的有效结论"
    scope: "所有内容包；等待第二独立案例"
    owner: "managing_editor"
    classification: "internal"
    introduced_on: "2026-07-21"
    regression_check: "下次状态回退时检查所有派生结论是否失效"
    next_review_on: "2026-08-21"

  - id: "CORE-ISOLATION-001"
    pattern: "公司稿与个人稿未及时分叉，可能复用受限表达、结构和视觉资产"
    evidence_level: "severity_override"
    source_cases: ["spain-opta-world-cup-prediction:OPTA-FB-032"]
    disposition: "promoted_hard_gate"
    rule_source: "AGENTS.md"
    trigger: "同一事实用于公司与个人账号或不同权利边界的项目"
    action: "建立独立 brief、正文和视觉方案，只共享已核事实"
    pass_condition: "成稿表达、结构、图片、图注和结尾均独立"
    failure_signal: "仅换词或继续引用公司视觉资产"
    scope: "公司与个人内容隔离"
    owner: "managing_editor"
    classification: "internal"
    introduced_on: "2026-07-21"
    regression_check: "跨账号改编时做结构与视觉来源对照"
    next_review_on: "2026-08-21"

  - id: "PROJECT-IMAGE2-001"
    pattern: "需要 AI 生图或重绘时，由 Codex 直接调用内置 gpt-image-2；笨拙涂鸦逐字使用用户确认的内部 Prompt，并由 Codex 承担质检、迭代和回填"
    evidence_level: "project_configuration"
    source_cases: ["user-feedback:2026-07-21-image2-direct-generation", "user-feedback:2026-07-21-image2-codex-owned-workflow"]
    disposition: "project_adapter"
    rule_source: "共享/运营/SOP/Image2 生图工作流.md"
    trigger: "任务需要 AI 新图、参考图重绘或图片编辑"
    action: "参考图可访问时由 Codex 内置 gpt-image-2 直接生成；固定风格 Prompt 逐字调用，原尺寸复检后做单变量迭代，并用 manifest version 2 回填内容包"
    pass_condition: "成品进入 assets，正文使用相对路径，Prompt 引用与哈希、生成模式、执行约束、输入图改编权、模型、迭代和允许平台均进入 manifest version 2；正文引用交叉核对、版权 allowlist 与 validator 通过"
    failure_signal: "让用户手动复制 Prompt、凭描述伪造参考输入、未做原尺寸复检、只留临时文件或漏记权利"
    scope: "本项目视觉 adapter"
    owner: "visual_rights_editor"
    classification: "internal"
    introduced_on: "2026-07-21"
    regression_check: "下一次含参考图的 Image2 任务核对运行时、Prompt 哈希、原尺寸复检、迭代记录、路径和 manifest version 2，并运行 validator 反例门禁"
    next_review_on: "2026-08-21"

  - id: "PROJECT-APPSO-AI-STYLE-001"
    pattern: "APPSO 编辑创意图虽已登记固定 Prompt，但通用科技媒体模板仍可能在首次调用时抢先覆盖，造成风格回归"
    evidence_level: "project_configuration"
    source_cases: ["ai-agents-real-world-loss:DLV-005", "user-feedback:2026-07-22-governed-style-routing-regression"]
    disposition: "project_adapter"
    rule_source: "APPSO-数字资产/03-SOP/APPSO 内容生产 SOP.md#image2-风格化重绘"
    trigger: "APPSO 内容包需要封面创意图、气氛图或不承担新闻证据职责的 AI 解释性示意图"
    action: "按显式 task 用户覆盖、APPSO adapter 固化的 package style_policy、通用 profile 的顺序解析；默认锁定 appsso-004，package policy 不作为独立授权源；先复用已登记的合法本地参考，无参考图时才新建内部结构参考；每阶段调用前执行确定性 preflight，并把临时 tool_request 原样传给 image_gen"
    pass_condition: "最终阶段使用档案允许的编辑模式、Prompt 哈希与改编权明确的参考输入；结构参考只作为中间件；正向约束不含冲突风格词；成品可观察到固定风格特征"
    failure_signal: "首次调用落入成熟科技媒体、干净矢量或电影感模板；固定风格直接 text_to_image；缺参考图、未授权输入或 Prompt 哈希变化仍调用；手工重写 tool_request；把内部结构参考当成样张交付"
    scope: "APPSO 的 ai_editorial_creative；默认排除官方资料、原帖和新闻图片、真实产品或界面截图、Logo 与要求数值精确的图表；内容包可对定性解释图显式选择并记录原因"
    owner: "visual_rights_editor"
    classification: "internal"
    introduced_on: "2026-07-22"
    regression_check: "正例：已登记本地参考可直接通过最终阶段，无参考图时参考阶段通过、登记输入后最终阶段通过；tool_request 精确映射三种输入绑定且不落盘；反例：缺参考、错误模式、冲突正向词与未授权输入均在调用前失败；通用无参考图 profile 仍可直接生成且不注入 appsso-004"
    next_review_on: "2026-08-22"

  - id: "PROJECT-APPSO-VOICE-001"
    pattern: "APPSO 冷静分析型长文虽然事实完整，却按来源写成几份小报告；之后再均匀添加短句、口语和否定对比，形成新的模板节奏"
    evidence_level: "project_configuration"
    source_cases: ["amazon-agi-ai-hiring-signals:FB-007—009", "spain-opta-world-cup-prediction:OPTA-FB-014—018", "openai-long-horizon-safety:LH-FB-003,005"]
    disposition: "project_adapter"
    rule_source: "APPSO-数字资产/03-SOP/APPSO 内容生产 SOP.md#冷静分析型长文的叙事与节奏-adapter"
    trigger: "APPSO 约 2500—7000 个中文字符、需要连接多组事实或来源的冷静分析型长文进入人话编辑"
    action: "先锁唯一问题和材料的事实 / 机制 / 限制 / 后果角色，建立线性依赖或平行比较尺度并删除报告脚手架；再标语义换挡短句、4—5 个候选口语落点、框架词簇，并扫描高显著强对比是否必要；结尾只兑现原承诺"
    pass_condition: "隐藏小标题后仍能复述线性依赖或平行比较尺度；候选口语不均匀撒布且每处承担判断、动作或后果；同类框架词不扎堆；高显著强对比默认可以为 0，实际保留项承担真实逻辑区分；末句不另开方法论"
    failure_signal: "日期式通稿开头延迟读者问题；每个来源各写一份小报告；每节固定插入口语；独立短句没有语义任务；结尾收束后又出现第二套个人建议"
