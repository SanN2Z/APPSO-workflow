    pattern: "视觉复核只检查数量、Logo、manifest、文字溢出和信息密度，会把稀疏模板卡或纯文字编辑卡误判为插画信息图；即使执行者读过用户提供的 Prompt 与成功案例，只要没有绑定进实际生成任务，成品仍会偏离"
