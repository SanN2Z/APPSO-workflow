    next_review_on: "2026-09-21"

  - id: "CORE-CAPABILITY-BUNDLE-001"
    pattern: "只把当前稿件的 Python、Wenyan 和局部 doctor 做到 clone-ready，仍会遗漏 X 入口、公司 Codex／Claude、浏览器扩展加载路径、配置模板和受限资产迁移；维护者机器上已有的全局 CLI 与本地散件会掩盖这些缺口"
    evidence_level: "E0"
    effectiveness_status: "unverified_but_owner_binding"
    source_cases: ["user-feedback:2026-08-22-package-all-capabilities", "workspace-cold-clone:809f2e0"]
    disposition: "expand_existing_operational_contract"
    default_status: "active_repository_portability_gate"
    rule_source: "共享/运营/SOP/内容工作流.md#CORE-PORTABILITY-001"
    trigger: "修改 SOP、Skill、依赖、workflow、平台脚本、公司工具，或准备把仓库迁移到另一台机器"
    action: "在单一 manifest 中登记全部能力包、精确 Python／Node 依赖、Python／PowerShell 入口、配置模板、版本化公司资产、host 条件和 local-only 导入器；bootstrap 从零恢复，doctor 分开报告 bundle completeness 与 runtime readiness"
    pass_condition: "真正的 --no-local 冷 clone 可运行 bootstrap -FullTest 与 workflow verify；9 个能力包全部 PACKED；Codex／Claude 和 X 等新增入口有真实冒烟证据；本地值缺失被列为输入而不是缺包"
    failure_signal: "依赖全局 codex／claude、从桌面找脚本、X 命令从错误目录读配置、Windows 时区依赖漏锁、只有配置文档而没有模板／导入器，或把本机登录态复制进 Git"
    scope: "当前私有自媒体运营仓库的 Windows PowerShell 可迁移工作流；不自动安装系统级 Git／Python／Node／浏览器，不复制远端服务、账号值、Cookie、登录态或受治理原文"
    owner: "project_owner_and_repository_maintainer"
    classification: "internal"
    introduced_on: "2026-08-22"
    regression_check: "运行 source-only、capabilities doctor --bundle-only、全量测试、仓库 preflight；从精确提交建立不共享文件的 --no-local 冷 clone，执行 bootstrap -FullTest、workflow verify、clone 内 CLI 版本与无写入入口冒烟"
