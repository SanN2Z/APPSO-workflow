schema_version: 1
updated_on: "2026-07-25"
timezone: "Asia/Tokyo"

triggers:
  delivery_or_publish:
    action: "初始化或更新内容包 retrospective.md，记录本轮版本、已知反馈和下一次复盘日期"
    due: "同一工作日"
  feedback_received:
    action: "逐条登记用户或编辑意见；先归案例，再判断是否成为 SOP 候选"
    due: "收到反馈的同一工作会话"
  post_publish_followup:
    action: "复核早期数据、评论、转载与执行问题"
    due_after_days: 7
  weekly:
    action: "清理待处理反馈、到期复盘和 SOP 候选"
    schedule: "每周五"
  monthly:
    action: "审计重复缺陷、SOP 冲突、失效规则与可迁移工作流"
    schedule: "每月 1 日"
  insight_checkpoint:
    action: "先关闭到期洞察实验，再更新支持、反对与中性证据；不得自动扩大命题或直接升级 SOP"
    schedule: "每周五，并以洞察台账中的 next_review_on 为准"
  public_media_reference_refresh:
    action: "复核公开科技媒体的官方入口、robots 与版权边界；低频更新元数据目录，抽样复查结构 adapter，不保存正文或把样本自动升级为 SOP"
    schedule: "每月 1 日；站点规则或授权状态变化时立即复核"
  judgment_and_clumsy_writing_trial:
    action: "复核适用长稿是否完成真实共创、公司／个人案例路线是否正确、主判断能否复述、结构返工是否减少，以及笨拙初稿有没有增加事实、逻辑、语法缺陷或讨论成本"
    schedule: "累计 3 篇符合条件的长稿，或 2026 年 8 月 25 日，以先到者为准"

promotion:
  default_min_independent_cases: 2
  severe_single_case_override:
    - "事实准确性"
    - "图片与版权"
    - "隐私与凭据"
    - "发布与不可逆外部操作"

artifacts:
  package_record: "<content-package>/retrospective.md"
  feedback_ledger: "共享/运营/复盘/反馈模式台账.yml"
  sop_change_ledger: "共享/运营/复盘/SOP 变更台账.yml"
  insight_registry: "共享/研究/洞察实验室/洞察台账.yml"
