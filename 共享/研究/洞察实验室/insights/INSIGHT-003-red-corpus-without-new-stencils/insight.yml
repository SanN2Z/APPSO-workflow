  decision: framed
  rationale: 用户明确要求建立红黑语料库；已把红库实现为 18 类带内容触发与反模板边界的表达动作，并预先冻结 3 篇配对验证的主指标、阈值和护栏。当前只有配置动机与资产，没有效果数据，保持 E0。
  evidence_refs:
