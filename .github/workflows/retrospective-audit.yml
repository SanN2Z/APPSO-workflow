name: Retrospective and insight audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 5"
    - cron: "15 0 1 * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install insight audit dependency
        run: python -m pip install -r .agents/skills/insight-to-asset/requirements.txt
      - name: Audit due retrospectives
        run: python .agents/skills/content-retrospective/scripts/audit_retrospectives.py --root .
      - name: Validate insight laboratory
        run: python .agents/skills/insight-to-asset/scripts/insight_loop.py validate
      - name: Audit due insight reviews
        run: python .agents/skills/insight-to-asset/scripts/insight_loop.py status --fail-on-due
