# 复制为 APPSO 普通长文内容包的 publish.yml，再填写每稿字段。
# draft.md 仍是正文唯一真源。默认进入公众号后台继续人工微调；
# 密封主题在后台验证前只能创建资格验证草稿；精确账号与主题版本组合
# 验证通过后才可用于生产。切换时改 delivery_mode 与 layout_profile，并补齐头图。
title: ""
author: ""
digest: ""
cover: "assets/cover.png"
source_url: ""
project_adapter: "appsso"
delivery_mode: "manual_editor"
theme: "default"
layout_profile: "default"
# 密封草稿改为：delivery_mode: "sealed_draft"，layout_profile: "appsso-article-v1"。
highlight: "solarized-light"
mac_style: false
footnote: true
need_open_comment: false
only_fans_can_comment: false

# 头尾图与交付模式正交。如需注入，先将权利明确的内部原件放入当前内容包，
# 在 asset-manifest.yml 登记 use: "wechat_body_header"、allowed_platforms: ["wechat"]，再填写下列字段。
header_image: ""
header_alt: ""

# 尾图默认关闭。启用时填写真实替代文本，并按 Asia/Shanghai 填写下一次复核截止日。
# 该日期不是招聘或活动的真实截止日；从本次确认日起最长不得超过 365 天。
footer_image: ""
footer_alt: ""
footer_valid_until: ""
